<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Dux-Soup High Fly</title>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
   <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet">
   <style>
       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           overflow: hidden;
           font-family: 'Inter', sans-serif;
           user-select: none;
           -webkit-user-select: none;
           -webkit-tap-highlight-color: transparent;
           background-color: #000;
       }
       canvas {
           display: block;
           margin: 0;
           z-index: 0;
       }
       .pixel-font {
           font-family: 'Press Start 2P', cursive;
       }

       /* Name-entry modal. Previously styled with the Tailwind CDN, which
          pulled a large stylesheet over the network for this one dialog (and
          warned about production use on every load). The .hidden/.flex
          utilities are kept because the game's JS toggles them by name. */
       .hidden { display: none !important; }
       .flex { display: flex !important; }

       .modal-overlay {
           position: absolute;
           inset: 0;
           width: 100%;
           height: 100%;
           display: flex;
           align-items: center;
           justify-content: center;
           background: rgba(0, 0, 0, 0.55);
           z-index: 50;
       }
       .modal-card {
           background: #1f2937;
           color: #e5e7eb;
           border-radius: 12px;
           box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
           padding: 24px;
           width: 92%;
           max-width: 24rem;
           text-align: center;
       }
       .modal-title {
           font-size: 1.35rem;
           line-height: 1.5;
           color: #93b4ff;
           margin: 0 0 16px;
       }
       .modal-text { margin: 0 0 16px; }
       #name-input {
           width: 100%;
           box-sizing: border-box;
           padding: 10px;
           border: 2px solid #4b5563;
           border-radius: 8px;
           margin-bottom: 16px;
           /* 16px keeps iOS from zooming the page when the field is focused */
           font-size: 16px;
           font-family: 'Inter', sans-serif;
       }
       .btn {
           display: block;
           width: 100%;
           box-sizing: border-box;
           border: none;
           border-radius: 8px;
           padding: 12px 16px;
           font-family: 'Inter', sans-serif;
           font-weight: 700;
           font-size: 1rem;
           color: #fff;
           cursor: pointer;
       }
       .btn-submit { background: #3b82f6; }
       .btn-submit:hover { background: #2563eb; }
       .btn-start { background: #22c55e; }
       .btn-start:hover { background: #16a34a; }
   </style>
</head>
<body>

   <div id="name-modal" class="modal-overlay hidden">
       <div class="modal-card">
           <h2 class="pixel-font modal-title">New High Score!</h2>
           <p class="modal-text">Enter your name for the leaderboard:</p>

           <div id="input-container" class="hidden">
                <input type="text" id="name-input" placeholder="Your Name" maxlength="10" autocomplete="off">
                <button id="submit-score-btn" class="btn btn-submit">Submit</button>
           </div>

           <button id="show-keyboard-btn" class="btn btn-start">Tap to Enter Name</button>
       </div>
   </div>

<script type="module">
       import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
       import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
       import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

       const firebaseConfig = {
           apiKey: "AIzaSyAn0TNTy9gxmIcr8n90M8yOz3-RyVU8yrU",
           authDomain: "highflygame-1ac8f.firebaseapp.com",
           projectId: "highflygame-1ac8f",
           storageBucket: "highflygame-1ac8f.firebasestorage.app",
           messagingSenderId: "850289020856",
           appId: "1:850289020856:web:211aa43351e86d39fe494d",
           measurementId: "G-02MMXM7KJ9"
       };
       const app = initializeApp(firebaseConfig);
       const auth = getAuth(app);
       const db = getFirestore(app);

       const appId = 'highflygame-1ac8f';

       const nameModal = document.getElementById('name-modal');
       const nameInput = document.getElementById('name-input');
       const submitScoreBtn = document.getElementById('submit-score-btn');
       const showKeyboardBtn = document.getElementById('show-keyboard-btn');
       const inputContainer = document.getElementById('input-container');

       let leaderboardDayRef, leaderboardNightRef, leaderboardStackedRef;
       let localLeaderboardDay = [];
       let localLeaderboardNight = [];
       let localLeaderboardStacked = [];
       let newHighScore = null;

       const listForMode = (mode) =>
           mode === 'stacked' ? localLeaderboardStacked : (mode === 'night' ? localLeaderboardNight : localLeaderboardDay);
       const refForMode = (mode) =>
           mode === 'stacked' ? leaderboardStackedRef : (mode === 'night' ? leaderboardNightRef : leaderboardDayRef);

       const handleSubmit = async () => {
           if (!newHighScore) return;
           const name = nameInput.value.trim() || 'Anonymous';
           newHighScore.name = name;
           const mode = newHighScore.mode;
           const relevantLeaderboard = listForMode(mode);
           const relevantRef = refForMode(mode);
           const updatedScores = [...relevantLeaderboard, newHighScore].sort((a, b) => b.score - a.score).slice(0, 20);
           try {
               await setDoc(relevantRef, { scores: updatedScores });
           } catch (error) {
               console.error("Error writing to leaderboard: ", error);
           }
           nameModal.classList.add('hidden');
           nameModal.classList.remove('flex');
           newHighScore = null;
           nameInput.value = '';
           // Restore the buttons to the initial state for next time
           inputContainer.classList.add('hidden');
           showKeyboardBtn.classList.remove('hidden');
           window.p5.resetGameAfterScoreSubmit();
           window.p5.loop();
       };

       const checkHighScore = (score, mode) => {
           if (score === 0) return false;
           const relevantLeaderboard = listForMode(mode);
           const lowestScore = relevantLeaderboard.length > 0 ? relevantLeaderboard[relevantLeaderboard.length - 1].score : 0;
           if (score > lowestScore || relevantLeaderboard.length < 20) {
               newHighScore = { score, mode };
               nameModal.classList.remove('hidden');
               nameModal.classList.add('flex');
               window.p5.noLoop();
               return true;
           }
           return false;
       };
       window.checkHighScore = checkHighScore;

       function setupLeaderboardListeners() {
           let dayDataReceived = false, nightDataReceived = false, stackedDataReceived = false, initialLoadSignaled = false;
           const push = () => {
               if (window.p5) window.p5.setLeaderboards(localLeaderboardDay, localLeaderboardNight, localLeaderboardStacked);
           };
           const signalReady = () => {
               if (dayDataReceived && nightDataReceived && stackedDataReceived && !initialLoadSignaled) {
                   initialLoadSignaled = true;
                   if (window.p5 && typeof window.p5.firebaseReady === 'function') {
                       window.p5.firebaseReady();
                   }
               }
           };
           leaderboardDayRef = doc(db, `artifacts/${appId}/public/data/leaderboard/day_mode`);
           onSnapshot(leaderboardDayRef, (doc) => {
               localLeaderboardDay = doc.exists() ? doc.data().scores || [] : [];
               dayDataReceived = true;
               push();
               signalReady();
           });
           leaderboardNightRef = doc(db, `artifacts/${appId}/public/data/leaderboard/night_mode`);
           onSnapshot(leaderboardNightRef, (doc) => {
               localLeaderboardNight = doc.exists() ? doc.data().scores || [] : [];
               nightDataReceived = true;
               push();
               signalReady();
           });
           leaderboardStackedRef = doc(db, `artifacts/${appId}/public/data/leaderboard/stacked_mode`);
           onSnapshot(leaderboardStackedRef, (doc) => {
               localLeaderboardStacked = doc.exists() ? doc.data().scores || [] : [];
               stackedDataReceived = true;
               push();
               signalReady();
           });
       }
       
       // --- EVENT LISTENERS ---
       showKeyboardBtn.addEventListener('click', () => {
           showKeyboardBtn.classList.add('hidden');
           inputContainer.classList.remove('hidden');
           nameInput.focus();
       });

       submitScoreBtn.addEventListener('click', handleSubmit);
       nameInput.addEventListener('keyup', (event) => {
           if (event.key === 'Enter') handleSubmit();
       });
       
       onAuthStateChanged(auth, (user) => {
           if (user) {
               setupLeaderboardListeners();
           } else {
               signInAnonymously(auth);
           }
       });
</script>

<script>
       // Your p5.js game code
       const DEPLOY_VERSION = '1.13.0';
       let bird;
       let birdImg, secretBirdImg, titleImg, sunImg, moonImg;
       let dayCloudImgs = [], nightCloudImgs = [];
       let pipes = [];
       let score = 0;
       let gameState = 'loading';
       let clouds = [];
       let midnightMode = false;
       let rain = [];
       let flashTimer = 0;
       let confetti = [];
       let leaderboardDayData = [];
       let leaderboardNightData = [];
       let leaderboardStackedData = [];
       let leaderboardTab = 'day';
       let bestDayScore = 0;
       let bestNightScore = 0;

       // --- NEW: Easter Egg and Effects variables ---
       let duxTapCount = 0;
       // Tapping the menu duck 5x toggles "star mode": a rapid rainbow strobe
       // on top of whichever duck the current mode uses.
       let starMode = false;
       let shakeDuration = 0;
       let shakeAmount = 0;
       let scorePopups = [];
       let impactParticles = [];
       let neonTrail = [];
       let gameOverAlpha = 0;
       let displayScore = 0;
       let lastScoreWasHighScore = false;
       // Brief input freeze after dying, so the tap that killed you (or panic
       // tapping) can't immediately trigger "Fly Again".
       let overInputLock = 0;

       // --- Shield power-up state ---
       let powerUp = null;
       let hasShield = false;
       let shieldGraceFrames = 0;
       let shieldFlashTimer = 0;
       let shieldParticles = [];

       // --- STACKED mode ---
       let stackedMode = false;
       let stackedHue = 0;
       let hazards = [];
       let stackedShapes = [];
       let bestStackedScore = 0;

       // Menu backdrop cycles day -> midnight -> stacked. Themes are rendered
       // into offscreen buffers so one can crossfade over the other.
       const MENU_THEMES = ['day', 'night', 'stacked'];
       const MENU_HOLD = 300;
       const MENU_FADE = 70;
       let menuBufA = null, menuBufB = null;
       let starBuf = null;

       window.p5 = this;
       
       this.setLeaderboards = (dayData, nightData, stackedData) => {
           leaderboardDayData = dayData;
           leaderboardNightData = nightData;
           leaderboardStackedData = stackedData || [];
       }
       this.resetGameAfterScoreSubmit = () => {
            gameState = 'over';
       }
       this.firebaseReady = () => {
           if (gameState === 'loading') {
               gameState = 'start';
           }
       }
       
       // All art is served from this project. It used to load from imgur,
       // which put every image behind a third-party host the game has no
       // control over - if it rate-limited or went down, the game broke.
       function preload() {
           birdImg = loadImage("assets/dux.png");
           secretBirdImg = loadImage("assets/dux-magenta.png");
           titleImg = loadImage("assets/title.png");
           sunImg = loadImage("assets/sun.png");
           moonImg = loadImage("assets/moon.png");

           dayCloudImgs.push(loadImage("assets/cloud-day.png"));
           nightCloudImgs.push(loadImage("assets/cloud-night-1.png"));
           nightCloudImgs.push(loadImage("assets/cloud-night-2.png"));
       }
       
       function setup() {
           const canvas = createCanvas(windowWidth, windowHeight);
           menuBufA = createGraphics(windowWidth, windowHeight);
           menuBufB = createGraphics(windowWidth, windowHeight);
           starBuf = createGraphics(256, 256);
           bird = new Bird();
           bestDayScore = parseInt(localStorage.getItem('duxHighFlyBestDay')) || 0;
           bestNightScore = parseInt(localStorage.getItem('duxHighFlyBestNight')) || 0;
           // Fall back to the old key so a returning player's personal best
           // does not silently reset to 0 after the RUSH -> STACKED rename.
           bestStackedScore = parseInt(localStorage.getItem('duxHighFlyBestStacked')) || parseInt(localStorage.getItem('duxHighFlyBestRush')) || 0;
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width), random(height * 0.05, height * 0.25)));
           }
       }
       
       function windowResized() {
           resizeCanvas(windowWidth, windowHeight);
           if (menuBufA) menuBufA.resizeCanvas(windowWidth, windowHeight);
           if (menuBufB) menuBufB.resizeCanvas(windowWidth, windowHeight);
           if (bird) {
                bird.baseY = height / 2;
                bird.reset();
           }
       }
       
       function draw() {
           if (shakeDuration > 0) {
               translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount));
               shakeDuration--;
           }

           if (gameState === 'start') {
               // Menu shows its own cycling backdrop rather than any one mode.
               drawMenuBackground();
           } else if (stackedMode) {
               drawStackedBackground();
           } else if (midnightMode) {
                background(8, 12, 24);
                imageMode(CENTER);
                image(moonImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
           } else {
               background(135, 206, 235);
           }

           if (gameState === 'loading') {
               drawLoadingScreen();
               return;
           }
           if (gameState !== 'start') {
               if (stackedMode) {
                   drawStackedScenery();
               } else if (!midnightMode) {
                   drawScenery();
               } else {
                   drawNightScenery();
               }
           }

           if (gameState !== 'start' && !stackedMode && (gameState === 'play' || gameState === 'over' || gameState === 'entering_name' || gameState === 'leaderboard')) {
                for (let cloud of clouds) {
                    cloud.show();
                    if(gameState === 'play') cloud.update();
                }
           }
            
           if (gameState === 'start' || gameState === 'play' || gameState === 'over') {
                for (let c of confetti) { c.show(); c.update(); }
           }


           if (gameState === 'start') {
               bird.hover();
               bird.show();
               drawStartScreen();
           } else if (gameState === 'play') {
               if (midnightMode) {
                   // Lightning is deliberately infrequent: a full-screen flash
                   // firing about once a second is unpleasant and a
                   // photosensitivity risk, so it stays an occasional beat.
                   if (random() < 0.005 && flashTimer <= 0) flashTimer = 3;
                   if (flashTimer > 0) {
                       push();
                       fill(200, 208, 255, 120);
                       noStroke();
                       rectMode(CORNER);
                       rect(0, 0, width, height);
                       pop();
                       flashTimer--;
                   }
                   for (let i = 0; i < 6; i++) { rain.push(new Rain(random(width * 1.1), random(-100, 0))); }
                   for (let i = rain.length - 1; i >= 0; i--) { rain[i].fall(); rain[i].show(); if (rain[i].offscreen()) rain.splice(i, 1); }
               }
               if (shieldFlashTimer > 0) {
                   push();
                   fill(255, 215, 60, 120);
                   noStroke();
                   rectMode(CORNER);
                   rect(0, 0, width, height);
                   pop();
                   shieldFlashTimer--;
               }
               for (let p of pipes) { p.show(); }
               for (let hz of hazards) { hz.show(); }
               if (powerUp) powerUp.show();
               bird.show();
               playGame();
               bird.update();
               if (stackedMode || starMode) {
                   neonTrail.push(new NeonSparkle(bird.x - bird.size * 0.35, bird.y));
               }
               for (let i = neonTrail.length - 1; i >= 0; i--) {
                   neonTrail[i].update();
                   neonTrail[i].show();
                   if (neonTrail[i].offscreen()) neonTrail.splice(i, 1);
               }
               for (let i = shieldParticles.length - 1; i >= 0; i--) {
                   shieldParticles[i].update();
                   shieldParticles[i].show();
                   if (shieldParticles[i].offscreen()) shieldParticles.splice(i, 1);
               }
               for (let i = scorePopups.length - 1; i >= 0; i--) {
                   scorePopups[i].update();
                   scorePopups[i].show();
                   if (scorePopups[i].offscreen()) scorePopups.splice(i, 1);
               }
               fill(255);
               stroke(0);
               strokeWeight(4);
               let size = height * 0.05;
               textSize(size);
               textFont('Press Start 2P');
               textAlign(CENTER, TOP);
               text(score, width / 2, 20);
           } else if (gameState === 'over' || gameState === 'entering_name') {
               if (midnightMode && !stackedMode) { for (let i = rain.length - 1; i >= 0; i--) { rain[i].show(); } }
               for (let p of pipes) { p.show(); }
               for (let hz of hazards) { hz.show(); }
               bird.show();
               for (let i = impactParticles.length - 1; i >= 0; i--) {
                   impactParticles[i].update();
                   impactParticles[i].show();
                   if (impactParticles[i].offscreen()) impactParticles.splice(i, 1);
               }
               if (gameState === 'over') {
                   drawGameOverScreen();
               }
           } else if (gameState === 'leaderboard') {
               drawLeaderboardScreen();
           }
       }
       
       function drawLoadingScreen() {
           background(30, 30, 30);
           textAlign(CENTER, CENTER);
           textFont('Press Start 2P');
           textSize(height * 0.05);
           fill(255);
           text('Loading...', width / 2, height / 2);
       }
       
       function drawScenery() {
           fill(34, 139, 34);
           noStroke();
           rect(0, height - 50, width, 50);
           imageMode(CENTER);
           image(sunImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
       }

       function drawNightScenery() {
           fill(10, 12, 20);
           noStroke();
           rect(0, height - 50, width, 50);
       }

       // --- STACKED mode visuals ---
       // Ping-pong the hue across a synthwave band (cyan -> blue -> purple ->
       // magenta). A full 0-360 cycle would swing through olive/brown, which
       // turns muddy at these low brightnesses.
       function stackedHueAt(phase) {
           let t = (((phase % 360) + 360) % 360) / 360;
           let tri = t < 0.5 ? t * 2 : (1 - t) * 2;
           return 185 + tri * 150;
       }

       function stackedColor(offset, sat = 90, bri = 100, alpha = 255) {
           push();
           colorMode(HSB, 360, 100, 100, 255);
           let c = color(stackedHueAt(stackedHue + offset), sat, bri, alpha);
           pop();
           return c;
       }

       function drawStackedBackground() {
           if (gameState === 'play') stackedHue = (stackedHue + 1.1) % 360;

           push();
           colorMode(HSB, 360, 100, 100, 255);
           noStroke();
           // vertical gradient between two cycling hues
           let bands = 24;
           let bandH = height / bands;
           for (let i = 0; i < bands; i++) {
               let t = i / (bands - 1);
               // deep + saturated so the neon foreground stays readable
               fill(stackedHueAt(stackedHue + t * 70), 92, lerp(16, 40, t));
               rect(0, i * bandH - 1, width, bandH + 2);
           }
           pop();

           // beat pulse
           let beat = (frameCount % 40) / 40;
           if (beat < 0.18) {
               push();
               noStroke();
               fill(255, 255, 255, map(beat, 0, 0.18, 45, 0));
               rect(0, 0, width, height);
               pop();
           }
       }

       function drawStackedScenery() {
           for (let s of stackedShapes) {
               if (gameState === 'play') s.update();
               s.show();
           }
           // neon floor strip
           push();
           noStroke();
           fill(stackedColor(180, 90, 60));
           rect(0, height - 40, width, 40);
           fill(stackedColor(180, 80, 100, 200));
           rect(0, height - 44, width, 4);
           pop();
       }

       function currentMode() {
           return stackedMode ? 'stacked' : (midnightMode ? 'night' : 'day');
       }

       // Deterministic pseudo-random in [0,1) so menu decor keeps its position
       // between frames without needing stored state.
       function hash01(n) {
           let v = sin(n * 127.1) * 43758.5453;
           return abs(v - floor(v));
       }

       function drawThemeTo(g, theme) {
           const W = g.width, H = g.height;
           g.push();
           g.noStroke();

           if (theme === 'day') {
               g.background(135, 206, 235);
               g.imageMode(CENTER);
               if (sunImg) g.image(sunImg, W * 0.86, H * 0.16, W * 0.085, W * 0.085);
               g.imageMode(CORNER);
               if (dayCloudImgs.length) {
                   let img = dayCloudImgs[0];
                   for (let i = 0; i < 4; i++) {
                       let cw = W * (0.11 + 0.03 * hash01(i + 1));
                       let span = W + cw * 2;
                       let x = W + cw - ((frameCount * 0.3 + i * span / 4) % span);
                       let y = H * (0.06 + 0.07 * i);
                       g.image(img, x, y, cw, cw * (img.height / img.width));
                   }
               }
               g.fill(34, 139, 34);
               g.rect(0, H - 50, W, 50);

           } else if (theme === 'night') {
               g.background(8, 12, 24);
               g.imageMode(CENTER);
               if (moonImg) g.image(moonImg, W * 0.86, H * 0.16, W * 0.085, W * 0.085);
               g.imageMode(CORNER);
               if (nightCloudImgs.length) {
                   for (let i = 0; i < 4; i++) {
                       let img = nightCloudImgs[i % nightCloudImgs.length];
                       let cw = W * (0.12 + 0.04 * hash01(i + 7));
                       let span = W + cw * 2;
                       let x = W + cw - ((frameCount * 0.45 + i * span / 4) % span);
                       let y = H * (0.05 + 0.07 * i);
                       g.image(img, x, y, cw, cw * (img.height / img.width));
                   }
               }
               g.stroke(190, 200, 255, 130);
               g.strokeWeight(2);
               for (let i = 0; i < 70; i++) {
                   let x = (hash01(i + 21) * W + frameCount * 6) % W;
                   let y = (hash01(i + 55) * H + frameCount * 15) % H;
                   g.line(x, y, x + 4, y + 16);
               }
               g.noStroke();
               g.fill(10, 12, 20);
               g.rect(0, H - 50, W, 50);

           } else {
               g.colorMode(HSB, 360, 100, 100, 255);
               let bands = 24, bandH = H / bands;
               for (let i = 0; i < bands; i++) {
                   let t = i / (bands - 1);
                   g.fill(stackedHueAt(frameCount * 1.1 + t * 70), 92, lerp(16, 40, t));
                   g.rect(0, i * bandH - 1, W, bandH + 2);
               }
               g.noFill();
               g.strokeWeight(2);
               for (let i = 0; i < 12; i++) {
                   let size = H * (0.03 + 0.07 * hash01(i + 3));
                   let span = W + size * 2;
                   let x = W + size - ((frameCount * (0.5 + hash01(i + 9) * 1.6) + i * span / 12) % span);
                   let y = H * (0.06 + 0.8 * hash01(i + 31));
                   g.stroke(stackedHueAt(frameCount * 1.1 + hash01(i + 5) * 360), 80, 100, 110);
                   g.push();
                   g.translate(x, y);
                   g.rotate(frameCount * 0.01 + i);
                   let kind = floor(hash01(i + 13) * 3);
                   if (kind === 0) g.ellipse(0, 0, size);
                   else if (kind === 1) g.triangle(0, -size / 2, size / 2, size / 2, -size / 2, size / 2);
                   else { g.rectMode(CENTER); g.rect(0, 0, size, size, 4); }
                   g.pop();
               }
               g.noStroke();
               g.fill(stackedHueAt(frameCount * 1.1 + 180), 90, 60);
               g.rect(0, H - 40, W, 40);
               g.fill(stackedHueAt(frameCount * 1.1 + 180), 80, 100, 200);
               g.rect(0, H - 44, W, 4);
               g.colorMode(RGB, 255);
           }
           g.pop();
       }

       function drawMenuBackground() {
           if (!menuBufA || !menuBufB || width <= 0 || height <= 0) {
               background(135, 206, 235);
               return;
           }
           // Re-sync the buffers if they ever drift from the canvas. A page
           // that loads with a zero-size viewport (hidden tab, mid-rotation)
           // would otherwise create 0x0 buffers and throw on every drawImage,
           // with no way to recover once the window got its real size.
           if (menuBufA.width !== width || menuBufA.height !== height) {
               menuBufA.resizeCanvas(width, height);
               menuBufB.resizeCanvas(width, height);
           }
           let idx = floor(frameCount / MENU_HOLD) % MENU_THEMES.length;
           let within = frameCount % MENU_HOLD;
           let fade = within > MENU_HOLD - MENU_FADE
               ? (within - (MENU_HOLD - MENU_FADE)) / MENU_FADE
               : 0;

           drawThemeTo(menuBufA, MENU_THEMES[idx]);
           imageMode(CORNER);
           image(menuBufA, 0, 0);

           if (fade > 0) {
               drawThemeTo(menuBufB, MENU_THEMES[(idx + 1) % MENU_THEMES.length]);
               // Composite with the context's own alpha rather than p5's
               // tint(): tint copies the image and runs getImageData over it,
               // which on a full-screen buffer is a multi-megabyte pixel
               // readback every frame of the fade.
               push();
               drawingContext.globalAlpha = fade;
               image(menuBufB, 0, 0);
               drawingContext.globalAlpha = 1;
               pop();
           }
       }

       // Difficulty ramps with score instead of being fixed, so every mode
       // opens forgiving and tightens as a run goes on. `ramp` is the score at
       // which a mode reaches its hardest settings.
       function modeDifficulty() {
           let cfg;
           if (stackedMode) {
               cfg = { ramp: 900, gap: [0.40, 0.26], spd: [0.0058, 0.0105], iv: [84, 40] };
           } else if (midnightMode) {
               cfg = { ramp: 700, gap: [0.36, 0.25], spd: [0.0055, 0.0095], iv: [85, 45] };
           } else {
               cfg = { ramp: 900, gap: [0.42, 0.30], spd: [0.0042, 0.0072], iv: [105, 62] };
           }
           let t = constrain(score / cfg.ramp, 0, 1);
           return {
               spacing: lerp(cfg.gap[0], cfg.gap[1], t) * height,
               speed: lerp(cfg.spd[0], cfg.spd[1], t) * width,
               interval: round(lerp(cfg.iv[0], cfg.iv[1], t)),
               t
           };
       }

       // Menu button metrics. There are 4 buttons (Start/Midnight/Leaderboard/
       // STACKED), so they shrink and the stack is anchored to the bottom to
       // stay on screen.
       function startMenuLayout() {
           let btnWidth = min(width * 0.7, 400);
           let btnHeight = height * 0.068;
           let step = btnHeight + 14;
           return { btnWidth, btnHeight, step, count: 4, base: height * 0.94 - btnHeight / 2 - step * 3 };
       }
       
       function drawStartScreen() {
           if (titleImg) {
               imageMode(CENTER);
               let imgWidth = min(width * 0.8, 500);
               let imgHeight = imgWidth * (titleImg.height / titleImg.width);
               image(titleImg, width / 2, height / 4, imgWidth, imgHeight);
           }

           noStroke();
           fill(255);
           textFont('Inter');
           textSize(max(11, height * 0.017));
           textAlign(CENTER, CENTER);
           let L = startMenuLayout();
           let bestLine = `Day Best: ${bestDayScore}    Night Best: ${bestNightScore}    Stacked Best: ${bestStackedScore}`;
           text(bestLine, width / 2, L.base - L.btnHeight / 2 - height * 0.035);

           let btnWidth = L.btnWidth;
           let btnHeight = L.btnHeight;
           let base = L.base;
           let step = L.step;
           let sBy1 = base, sBy2 = base + step, sBy3 = base + step * 2;
           drawButton("Start Flying", width / 2, sBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy1, btnWidth, btnHeight));
           drawButton("Midnight Flight", width / 2, sBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy2, btnWidth, btnHeight));
           drawButton("Leaderboard", width / 2, sBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy3, btnWidth, btnHeight));

           let sBy4 = base + step * 3;
           drawStackedButton("⚡ STACKED ⚡", width / 2, sBy4, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy4, btnWidth, btnHeight));

           drawDuxLink();
           
           noStroke();
           fill(255);
           textSize(12);
           textAlign(RIGHT, BOTTOM);
           textFont('Inter');
           text(`v${DEPLOY_VERSION}`, width - 10, height - 10);
       }
       
       function drawGameOverScreen() {
           if (overInputLock > 0) overInputLock--;
           gameOverAlpha = min(gameOverAlpha + 12, 150);
           fill(0, 0, 0, gameOverAlpha);
           rect(0, 0, width, height);
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);
           let titleSize = height * 0.08;
           textSize(titleSize);
           if (stackedMode) {
               fill(stackedColor(0, 90, 100));
               stroke(0);
               strokeWeight(3);
               text('STACKED OVER', width/2, height * 0.3);
           } else {
               fill(180, 0, 0);
               stroke(0);
               strokeWeight(2);
               text('Game Over', width/2, height * 0.3);
           }

           fill(255, 230);

           text(`Best: ${modeBest}`, width/2, height * 0.51);

               drawButton("Leaderboard", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));
           } else {
               drawButton("Fly Again", width / 2, gBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy1, btnWidth, btnHeight));

               }
               drawButton("Leaderboard", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));

           drawDuxLink();

       // Medals give a run something to aim at between "died early" and
       // "made the leaderboard". STACKED thresholds are higher because it pays
       // double per pipe.
       function medalFor(s, mode) {
           const tiers = mode === 'stacked'
               ? [[2500, 'PLATINUM', [226, 232, 240], [148, 163, 184]],
                  [1200, 'GOLD',     [255, 215, 60],  [186, 148, 20]],
                  [600,  'SILVER',   [226, 226, 232], [150, 150, 165]],
                  [300,  'BRONZE',   [214, 148, 84],  [148, 96, 48]]]
               : [[2000, 'PLATINUM', [226, 232, 240], [148, 163, 184]],
                  [1000, 'GOLD',     [255, 215, 60],  [186, 148, 20]],
                  [500,  'SILVER',   [226, 226, 232], [150, 150, 165]],
                  [250,  'BRONZE',   [214, 148, 84],  [148, 96, 48]]];
           for (const [min, name, c1, c2] of tiers) {
               if (s >= min) return { name, c1, c2 };
           }
           return null;
       }

       function drawMedal(m, x, y, r) {
           push();
           noStroke();
           fill(m.c2[0], m.c2[1], m.c2[2]);
           ellipse(x, y, r * 2.15);
           fill(m.c1[0], m.c1[1], m.c1[2]);
           ellipse(x, y, r * 1.75);
           fill(255, 255, 255, 90);
           drawStar(x, y, r * 0.3, r * 0.68, 5);
           noStroke();
           fill(m.c1[0], m.c1[1], m.c1[2]);
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);
           textSize(max(9, r * 0.42));
           text(m.name, x, y + r * 1.65);
           pop();
       }

       function drawLeaderboardColumn(data, startIdx, count, xName, xScore, yStart, entrySize, lineGap) {
           textSize(entrySize);
           fill(255);
           for (let i = 0; i < count; i++) {
               let idx = startIdx + i;
               if (idx >= data.length) break;
               let y = yStart + i * (entrySize + lineGap);
               textAlign(LEFT, CENTER);
               text(`${idx + 1}. ${data[idx].name}`, xName, y);
               textAlign(RIGHT, CENTER);
               text(data[idx].score, xScore, y);
           }
       }

       const LEADERBOARD_TABS = [
           { id: 'day', label: 'DAY' },
           { id: 'night', label: 'MIDNIGHT' },
           { id: 'stacked', label: 'STACKED' }
       ];

       function leaderboardTabRect(i) {
           let tabW = min(width * 0.29, 190);
           let tabH = max(height * 0.06, 34);
           let gap = tabW * 0.06;
           let totalW = tabW * 3 + gap * 2;
           let x = width / 2 - totalW / 2 + tabW / 2 + i * (tabW + gap);
           return { x, y: height * 0.09, w: tabW, h: tabH };
       }

       function leaderboardDataFor(id) {
           if (id === 'stacked') return leaderboardStackedData;
           if (id === 'night') return leaderboardNightData;
           return leaderboardDayData;
       }

       function drawLeaderboardScreen() {
           fill(0, 0, 0, 150);
           rect(0, 0, width, height);
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);

           // mode tabs
           for (let i = 0; i < LEADERBOARD_TABS.length; i++) {
               let tab = LEADERBOARD_TABS[i];
               let r = leaderboardTabRect(i);
               let selected = leaderboardTab === tab.id;
               let hovered = isMouseOverRect(r.x, r.y, r.w, r.h);
               push();
               rectMode(CENTER);
               strokeWeight(selected ? 3 : 2);
               if (tab.id === 'stacked') {
                   stroke(selected ? color(255, 255, 255) : color(255, 120, 220));
                   fill(selected ? color(150, 40, 170) : (hovered ? color(90, 30, 110) : color(45, 20, 60)));
               } else {
                   stroke(selected ? color(255, 255, 255) : color(150, 170, 220));
                   fill(selected ? color(60, 100, 255) : (hovered ? color(45, 60, 130) : color(25, 30, 60)));
               }
               rect(r.x, r.y, r.w, r.h, 8);
               noStroke();
               fill(selected ? 255 : 200);
               textFont('Press Start 2P');
               textSize(min(r.h * 0.3, r.w * 0.13));
               textAlign(CENTER, CENTER);
               text(tab.label, r.x, r.y);
               pop();
           }

           let data = leaderboardDataFor(leaderboardTab);

           push();
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);
           textSize(height * 0.022);
           fill(leaderboardTab === 'stacked' ? color(255, 120, 220) : color(255, 215, 0));
           let heading = leaderboardTab === 'stacked' ? '--- STACKED ---'
               : (leaderboardTab === 'night' ? '--- MIDNIGHT FLIGHT ---' : '--- DAY FLIGHT ---');
           text(heading, width / 2, height * 0.2);
           pop();

           if (data.length === 0) {
               push();
               textFont('Press Start 2P');
               textAlign(CENTER, CENTER);
               textSize(height * 0.018);
               fill(220);
               text('No scores yet', width / 2, height * 0.35);
               pop();
           } else if (width < 640) {
               // One full-width column: two narrow columns let 10-character
               // names collide with their scores on a phone.
               let entrySize = height * 0.015;
               let lineGap = height * 0.0085;
               drawLeaderboardColumn(data, 0, 20, width * 0.1, width * 0.9, height * 0.27, entrySize, lineGap);
           } else {
               let entrySize = height * 0.02;
               let lineGap = height * 0.009;
               let entryY = height * 0.28;
               drawLeaderboardColumn(data, 0, 10, width * 0.08, width * 0.44, entryY, entrySize, lineGap);
               drawLeaderboardColumn(data, 10, 10, width * 0.56, width * 0.92, entryY, entrySize, lineGap);
           }

           let btnWidth = min(width * 0.7, 400);
           let btnHeight = height * 0.08;
           let backY = height * 0.9;
           drawButton("Back", width / 2, backY, btnWidth, btnHeight, isMouseOverRect(width / 2, backY, btnWidth, btnHeight));

           drawDuxLink();
       }
       
       function getLinkTextSize() {
           return max(12, height * 0.018);
       }

       function getPortraitLinkY() {
           if (gameState === 'start') {
               let L = startMenuLayout();
               return L.base + L.step * (L.count - 1) + L.btnHeight / 2 + 22;
           }
           let btnHeight = height * 0.08;
           let step = btnHeight + 20;
           if (gameState === 'over') {
               return height * 0.7 + step * 2 + btnHeight / 2 + 30;
           }
           return height * 0.9 + btnHeight / 2 + 30;
       }

       // --- UPDATED: Responsive link positioning ---
       function drawDuxLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           const isHovering = isMouseOverLink();
           const linkColor = isHovering ? color(255, 255, 255) : color(200, 220, 255);
           
           fill(linkColor);
           noStroke();
           textFont('Inter');
           textSize(size);

           let x, y, linkW;
           const isPortrait = width < height;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                y = getPortraitLinkY();
                x = width / 2;
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW / 2, y + size / 2 + 2, x + linkW / 2, y + size / 2 + 2);
                }
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40; 
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW, y + 2, x, y + 2);
                }
           }
       }

       function isMouseOverLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           textFont('Inter');
           textSize(size);

           const isPortrait = width < height;
           let x, y, linkW, linkH;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                y = getPortraitLinkY();
                x = width / 2;
                linkW = textWidth(linkText);
                linkH = size * 2;
                return (mouseX > x - linkW / 2 && mouseX < x + linkW / 2 &&
                        mouseY > y - linkH / 2 && mouseY < y + linkH / 2);
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40;
                linkW = textWidth(linkText);
                linkH = size * 1.5; 
                return (mouseX > x - linkW && mouseX < x &&
                        mouseY > y - linkH && mouseY < y);
           }
       }
       
       function isMouseOverRect(x, y, w, h) {
           return mouseX > x - w / 2 && mouseX < x + w / 2 && mouseY > y - h / 2 && mouseY < y + h / 2;
       }

       function drawStackedButton(txt, x, y, w, h, hovered = false) {
           let by = y + (hovered ? -2 : 0);
           let cycle = (frameCount * 2) % 360;
           push();
           colorMode(HSB, 360, 100, 100, 255);
           rectMode(CENTER);
           // outer glow
           noStroke();
           fill(cycle, 90, 100, 60);
           rect(x, by, w + 14, h + 14, 14);
           // body gradient-ish bands
           let bands = 10;
           for (let i = 0; i < bands; i++) {
               let t = i / (bands - 1);
               fill((cycle + t * 120) % 360, 85, hovered ? 100 : 92);
               rect(x, by - h / 2 + h * ((i + 0.5) / bands), w, h / bands + 1, 0);
           }
           noFill();
           stroke(0, 0, 100);
           strokeWeight(3);
           rect(x, by, w, h, 10);
           pop();

           push();
           noStroke();
           fill(255);
           textFont('Press Start 2P');
           textSize(h * 0.28);
           textAlign(CENTER, CENTER);
           text(txt, x, by);
           pop();
           rectMode(CORNER);
       }

       function drawButton(txt, x, y, w, h, hovered = false) {
           let by = y + (hovered ? -2 : 0);
           stroke(255);
           strokeWeight(3);
           fill(hovered ? color(100, 140, 255) : color(60, 100, 255));
           rectMode(CENTER);
           rect(x, by, w, h, 10);
           fill(255);
           noStroke();
           textFont('Inter');
           textSize(h * 0.4);
           textAlign(CENTER, CENTER);
           text(txt, x, by);
           rectMode(CORNER);
       }
       
       function playGame() {
           if (shieldGraceFrames > 0) shieldGraceFrames--;

           let diff = modeDifficulty();
           // While a laser is telegraphing/firing, hold off on new pipes. That
           // keeps the corridor the player must thread through predictable, and
           // reads as a deliberate breather in the pipe rhythm.
           let holdPipes = stackedMode && hazards.length > 0;
            if (frameCount % diff.interval === 0 && !holdPipes) {
               let lastPipe = pipes.length > 0 ? pipes[pipes.length - 1] : null;
               let newPipe = new Pipe(lastPipe);
               pipes.push(newPipe);
               if (!hasShield && !powerUp && score > 0 && random() < (stackedMode ? 0.26 : 0.18)) {
                   powerUp = new PowerUp(newPipe.x + newPipe.w / 2, newPipe.top + newPipe.spacing / 2);
               }
           }

           if (stackedMode) {
               // One laser at a time, and only once a run is properly underway.
               if (score >= 150 && hazards.length === 0 && random() < lerp(0.005, 0.013, diff.t)) {
                   spawnSafeLaser();
               }
               for (let i = hazards.length - 1; i >= 0; i--) {
                   hazards[i].update();
                   if (hazards[i].hits(bird) && shieldGraceFrames <= 0) {
                       if (hasShield) {
                           hasShield = false;
                           shieldGraceFrames = 30;
                           shieldFlashTimer = 8;
                           for (let k = 0; k < 20; k++) shieldParticles.push(new ShieldParticle(bird.x, bird.y));
                       } else {
                           endGame();
                       }
                   }
                   if (hazards[i].done()) hazards.splice(i, 1);
               }
           }
           for (let i = pipes.length - 1; i >= 0; i--) {
               pipes[i].update();
               if (pipes[i].hits(bird) && shieldGraceFrames <= 0) {
                   if (hasShield) {
                       hasShield = false;
                       shieldGraceFrames = 24;
                       shieldFlashTimer = 8;
                       bird.velocity = bird.lift * 0.6;
                       for (let k = 0; k < 20; k++) shieldParticles.push(new ShieldParticle(bird.x, bird.y));
                   } else {
                       endGame();
                   }
               }
               if (!pipes[i].passed && pipes[i].x + pipes[i].w < bird.x) {
                   pipes[i].passed = true;
                   let gain = stackedMode ? 10 : 5;
                   score += gain;
                   scorePopups.push(new ScorePopup(bird.x, bird.y - bird.size * 0.7, gain));
                   if (score > 0 && score % 50 === 0) launchConfetti();
               }
               if (pipes[i].offscreen()) {
                   pipes.splice(i, 1);
               }
           }

           if (powerUp) {
               powerUp.update();
               if (powerUp.hits(bird)) {
                   hasShield = true;
                   for (let k = 0; k < 18; k++) shieldParticles.push(new ShieldParticle(powerUp.x, powerUp.y));
                   powerUp = null;
               } else if (powerUp.offscreen()) {
                   powerUp = null;
               }
           }

           if (bird.y > height - bird.size / 2 || bird.y < bird.size / 2) {
               endGame();
           }
       }
       
       function endGame() {
           if (gameState === 'over' || gameState === 'entering_name') return;
           
           shakeDuration = 20;
           shakeAmount = 8;
           gameOverAlpha = 0;
           displayScore = 0;
           overInputLock = 28;
           for (let i = 0; i < 24; i++) {
               impactParticles.push(new ImpactParticle(bird.x, bird.y));
           }

           if (stackedMode) {
               if (score > bestStackedScore) {
                   bestStackedScore = score;
                   localStorage.setItem('duxHighFlyBestStacked', bestStackedScore);
               }
           } else if (midnightMode) {
               if (score > bestNightScore) {
                   bestNightScore = score;
                   localStorage.setItem('duxHighFlyBestNight', bestNightScore);
               }
           } else {
               if (score > bestDayScore) {
                   bestDayScore = score;
                   localStorage.setItem('duxHighFlyBestDay', bestDayScore);
               }
           }

           if (window.checkHighScore(score, currentMode())) {
               lastScoreWasHighScore = true;
               gameState = 'entering_name';
           } else {
               lastScoreWasHighScore = false;
               gameState = 'over';
           }
       }
       
       function mousePressed() {
           if (gameState === 'entering_name') {
               return;
           }
           
           if (gameState === 'start' || gameState === 'over' || gameState === 'leaderboard') {
               if (isMouseOverLink()) {
                   window.open('https://www.dux-soup.com/', '_blank');
                   return; 
               }
           }

           if (gameState === 'start') {
               let d = dist(mouseX, mouseY, bird.x, bird.y);
               if (d < bird.size / 2) {
                   duxTapCount++;
                   if (duxTapCount === 5) {
                       starMode = !starMode;
                       if (starMode) launchConfetti(width / 2, height / 2, 200);
                       duxTapCount = 0;
                   }
               }
           }

           handleInput();
           return false;
       }

       function keyPressed() {
           if (gameState === 'entering_name') return;

           const flap = (key === ' ' || keyCode === UP_ARROW || key === 'w' || key === 'W');
           const confirm = (key === ' ' || keyCode === ENTER);

           if (gameState === 'play') {
               if (flap) { bird.up(); return false; }
               return;
           }
           // Keyboard parity with the mouse: start, retry and back-out without
           // having to reach for the pointer.
           if (gameState === 'start' && confirm) {
               midnightMode = false; stackedMode = false;
               startGame();
               return false;
           }
           if (gameState === 'over' && confirm) {
               if (overInputLock > 0) return false;
               startGame();
               return false;
           }
           if (gameState === 'leaderboard' && (confirm || keyCode === ESCAPE)) {
               gameState = 'start';
               return false;
           }
           if (gameState === 'over' && keyCode === ESCAPE) {
               stackedMode = false;
               gameState = 'start';
               return false;
           }
       }

       function handleInput() {
           if (gameState === 'play') {
               bird.up();
               return;
           }
           
           if (gameState === 'entering_name') return;

           let btnWidth, btnHeight;
           if (gameState === 'start') {
               let L = startMenuLayout();
               btnWidth = L.btnWidth;
               btnHeight = L.btnHeight;
               let base = L.base;
               let step = L.step;
               if (isMouseOverRect(width/2, base, btnWidth, btnHeight)) {
                   midnightMode = false;
                   stackedMode = false;
                   startGame();
               }
               if (isMouseOverRect(width/2, base + step, btnWidth, btnHeight)) {
                   midnightMode = true;
                   stackedMode = false;
                   startGame();
               }
               if (isMouseOverRect(width/2, base + step * 2, btnWidth, btnHeight)) {
                   gameState = 'leaderboard';
               }
               if (isMouseOverRect(width/2, base + step * 3, btnWidth, btnHeight)) {
                   midnightMode = false;
                   stackedMode = true;
                   startGame();
               }
           } else if (gameState === 'over') {
               if (overInputLock > 0) return;
               btnWidth = min(width * 0.7, 400);
               btnHeight = height * 0.08;
               let step = btnHeight + 20;
               if (isMouseOverRect(width/2, height*0.7, btnWidth, btnHeight)) {
                   startGame();
               }
               if (isMouseOverRect(width/2, height*0.7 + step, btnWidth, btnHeight)) {
                   if (stackedMode) {
                       stackedMode = false;
                       gameState = 'start';
                   } else {
                       midnightMode = !midnightMode;
                       startGame();
                   }
               }
               if (isMouseOverRect(width/2, height*0.7 + step * 2, btnWidth, btnHeight)) {
                   leaderboardTab = currentMode();
                   gameState = 'leaderboard';
               }
           } else if (gameState === 'leaderboard') {
               for (let i = 0; i < LEADERBOARD_TABS.length; i++) {
                   let r = leaderboardTabRect(i);
                   if (isMouseOverRect(r.x, r.y, r.w, r.h)) {
                       leaderboardTab = LEADERBOARD_TABS[i].id;
                       return;
                   }
               }
               btnWidth = min(width * 0.7, 400);
               btnHeight = height * 0.08;
               if (isMouseOverRect(width/2, height*0.9, btnWidth, btnHeight)) {
                   gameState = 'start';
               }
           }
       }
       
       function startGame() {
           gameState = 'play';
           pipes = [];
           confetti = [];
           scorePopups = [];
           impactParticles = [];
           neonTrail = [];
           shieldParticles = [];
           hazards = [];
           powerUp = null;
           hasShield = false;
           shieldGraceFrames = 0;
           shieldFlashTimer = 0;
           gameOverAlpha = 0;
           displayScore = 0;
           lastScoreWasHighScore = false;
           score = 0;
           bird.reset();
           pipes.push(new Pipe(null));
           clouds = [];
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width, width * 1.5), random(height * 0.05, height * 0.25)));
           }
           if (stackedMode) {
               stackedShapes = [];
               for (let i = 0; i < 14; i++) stackedShapes.push(new StackedShape());
           }
       }
       
       // Recolour a sprite's opaque pixels to a single cycling hue.
       //
       // tint() can't do this: it multiplies, so tinting the blue/yellow duck
       // red yields near-black rather than a red duck. Instead we stamp the
       // sprite into a scratch buffer and use a 'source-in' composite to paint
       // solid colour through its alpha mask, giving a true silhouette recolour.
       function starSilhouette(img) {
           if (!starBuf || !img) return null;
           starBuf.clear();
           starBuf.push();
           starBuf.imageMode(CORNER);
           starBuf.image(img, 0, 0, starBuf.width, starBuf.height);
           starBuf.drawingContext.globalCompositeOperation = 'source-in';
           starBuf.colorMode(HSB, 360, 100, 100, 255);
           starBuf.noStroke();
           starBuf.fill((frameCount * 26) % 360, 92, 100);
           starBuf.rect(0, 0, starBuf.width, starBuf.height);
           starBuf.drawingContext.globalCompositeOperation = 'source-over';
           starBuf.pop();
           return starBuf;
       }

       // Day flies the original duck; Midnight and STACKED fly the magenta one.
       // The menu always shows the default so the 5-tap star toggle reads
       // against a known baseline.
       function birdSpriteForMode() {
           if (gameState === 'start') return birdImg;
           return (stackedMode || midnightMode) ? secretBirdImg : birdImg;
       }

       class Bird {
           constructor() { this.size = height * 0.08; this.reset(); }
           reset() { this.size = height * 0.08; this.x = width / 4; this.y = height / 2; this.gravity = 0.0005 * height; this.lift = -0.012 * height; this.velocity = 0; this.baseY = height / 2; }
           update() { this.velocity += this.gravity; this.velocity *= 0.98; this.y += this.velocity; }
           hover() { this.x = width / 2; this.y = this.baseY + sin(frameCount * 0.05) * 10; this.velocity = 0; }
           show() {
               let imgToShow = birdSpriteForMode();
               push();
               translate(this.x, this.y);
               let angle = map(this.velocity, -10, 15, -PI / 4, PI / 4);
               if (gameState !== 'play') angle = 0;
               rotate(angle);
               imageMode(CENTER);
               if (gameState === 'play') {
                   let squashY = map(constrain(this.velocity, -10, 15), -10, 15, 0.82, 1.15);
                   scale(2 - squashY, squashY);
               }

               if (starMode) {
                   // Mario-style invincibility strobe: flash between the duck's
                   // own colours and a solid rainbow recolour of its shape.
                   let sil = (frameCount % 8 < 5) ? starSilhouette(imgToShow) : null;
                   image(sil || imgToShow, 0, 0, this.size, this.size);
               } else {
                   image(imgToShow, 0, 0, this.size, this.size);
               }
               pop();

               if (gameState === 'play' && hasShield) {
                   push();
                   noFill();
                   stroke(255, 215, 60, 180 + sin(frameCount * 0.3) * 60);
                   strokeWeight(3);
                   ellipse(this.x, this.y, this.size * 1.35 + sin(frameCount * 0.2) * 4);
                   pop();
               }
            }
           up() { this.velocity = this.lift; }
       }
       
       function drawStar(x, y, radius1, radius2, npoints) {
           let angle = TWO_PI / npoints;
           let halfAngle = angle / 2.0;
           beginShape();
           for (let a = 0; a < TWO_PI; a += angle) {
               let sx = x + cos(a) * radius2;
               let sy = y + sin(a) * radius2;
               vertex(sx, sy);
               sx = x + cos(a + halfAngle) * radius1;
               sy = y + sin(a + halfAngle) * radius1;
               vertex(sx, sy);
           }
           endShape(CLOSE);
       }

       class PowerUp {
           constructor(x, y) {
               this.x = x;
               this.y = y;
               this.size = height * 0.05;
               this.speed = modeDifficulty().speed;
               this.angle = 0;
           }
           update() {
               this.x -= this.speed;
               this.angle += 0.06;
           }
           show() {
               push();
               translate(this.x, this.y);
               let pulse = 1 + sin(frameCount * 0.15) * 0.1;
               noStroke();
               fill(255, 215, 60, 50);
               ellipse(0, 0, this.size * 2.2 * pulse);
               rotate(this.angle);
               fill(255, 223, 70);
               drawStar(0, 0, this.size * 0.28, this.size * 0.6, 5);
               pop();
           }
           offscreen() { return this.x < -this.size * 2; }
           hits(bird) {
               let r = this.size * 0.9 + bird.size * 0.35;
               return dist(this.x, this.y, bird.x, bird.y) < r;
           }
       }

       // Telegraphed horizontal laser bar: warns, fires, fades.
       class LaserBar {
           constructor() {
               this.y = random(height * 0.18, height * 0.82);
               this.thickness = height * 0.05;
               this.warn = 55;
               this.active = 45;
               this.fade = 18;
               // warm danger hue, deliberately outside the cool backdrop band
               this.hue = random([348, 356, 8]);
           }
           update() {
               if (this.warn > 0) this.warn--;
               else if (this.active > 0) this.active--;
               else if (this.fade > 0) this.fade--;
           }
           isFiring() { return this.warn <= 0 && this.active > 0; }
           done() { return this.warn <= 0 && this.active <= 0 && this.fade <= 0; }
           show() {
               push();
               colorMode(HSB, 360, 100, 100, 255);
               noStroke();
               if (this.warn > 0) {
                   // flashing warning strip + edge chevrons
                   let blink = (frameCount % 10 < 5) ? 255 : 120;
                   fill(this.hue, 95, 100, blink * 0.42);
                   rect(0, this.y - this.thickness / 2, width, this.thickness);
                   fill(this.hue, 90, 100, blink);
                   rect(0, this.y - 3, width, 6);
                   // hatched edges so it reads as "charging"
                   for (let hx = 0; hx < width; hx += 44) {
                       fill(this.hue, 70, 100, blink * 0.7);
                       rect(hx, this.y - this.thickness / 2, 22, 4);
                       rect(hx + 22, this.y + this.thickness / 2 - 4, 22, 4);
                   }
                   textAlign(CENTER, CENTER);
                   textFont('Press Start 2P');
                   textSize(this.thickness * 0.5);
                   fill(0, 0, 100, blink);
                   text('!', width * 0.05, this.y);
                   text('!', width * 0.95, this.y);
               } else if (this.active > 0) {
                   let t = this.thickness;
                   fill(this.hue, 80, 100, 70);
                   rect(0, this.y - t * 0.9, width, t * 1.8);
                   fill(this.hue, 85, 100, 220);
                   rect(0, this.y - t / 2, width, t);
                   fill(0, 0, 100, 230);
                   rect(0, this.y - t * 0.16, width, t * 0.32);
               } else if (this.fade > 0) {
                   fill(this.hue, 60, 100, map(this.fade, 0, 18, 0, 120));
                   rect(0, this.y - this.thickness / 4, width, this.thickness / 2);
               }
               pop();
           }
           hits(bird) {
               if (!this.isFiring()) return false;
               let r = bird.size / 4;
               return (bird.y + r > this.y - this.thickness / 2) && (bird.y - r < this.y + this.thickness / 2);
           }
       }

       // Place a laser only where the player can actually survive it.
       //
       // A full-width beam is dodged vertically, so it must never cover the
       // whole of a pipe gap the bird has to be inside while the beam is
       // firing. We work out which pipes will straddle the bird during the
       // firing window, then only accept a beam position that leaves a
       // bird-sized escape slot in every one of those gaps. If no candidate
       // qualifies, no laser spawns this time.
       function spawnSafeLaser() {
           const thickness = height * 0.05;
           const warnFrames = 55, activeFrames = 45;
           const margin = bird.size * 0.55;
           const need = bird.size * 1.3;

           let relevant = [];
           for (let p of pipes) {
               let xStart = p.x - p.speed * warnFrames;
               let xEnd = p.x - p.speed * (warnFrames + activeFrames);
               // pipe covers the bird's column when p.x is in [bird.x - w, bird.x]
               if (xEnd <= bird.x && xStart >= bird.x - p.w) relevant.push(p);
           }

           for (let attempt = 0; attempt < 30; attempt++) {
               let y = random(height * 0.16, height * 0.84);
               let bandTop = y - thickness / 2 - margin;
               let bandBot = y + thickness / 2 + margin;

               // must leave a usable slot between the beam and the screen edges
               if (max(bandTop, height - bandBot) < need) continue;

               let ok = true;
               for (let p of relevant) {
                   let gapTop = p.top;
                   let gapBot = p.top + p.spacing;
                   let above = bandTop - gapTop;
                   let below = gapBot - bandBot;
                   if (max(above, below) < need) { ok = false; break; }
               }
               if (!ok) continue;

               let lb = new LaserBar();
               lb.y = y;
               hazards.push(lb);
               return;
           }
       }

       // Drifting neon shapes in the STACKED backdrop.
       class StackedShape {
           constructor() {
               this.reset(true);
           }
           reset(anywhere = false) {
               this.x = anywhere ? random(width) : width + random(40, 200);
               this.y = random(height * 0.05, height * 0.9);
               this.size = random(height * 0.03, height * 0.11);
               this.speed = random(0.6, 2.4);
               this.spin = random(-0.03, 0.03);
               this.angle = random(TWO_PI);
               this.kind = floor(random(3));
               this.hueOffset = random(360);
           }
           update() {
               this.x -= this.speed;
               this.angle += this.spin;
               if (this.x < -this.size * 2) this.reset();
           }
           show() {
               push();
               translate(this.x, this.y);
               rotate(this.angle);
               noFill();
               stroke(stackedColor(this.hueOffset, 80, 100, 110));
               strokeWeight(2);
               if (this.kind === 0) {
                   ellipse(0, 0, this.size);
               } else if (this.kind === 1) {
                   triangle(0, -this.size / 2, this.size / 2, this.size / 2, -this.size / 2, this.size / 2);
               } else {
                   rectMode(CENTER);
                   rect(0, 0, this.size, this.size, 4);
                   rectMode(CORNER);
               }
               pop();
           }
       }

       class ShieldParticle {
           constructor(x, y) {
               this.x = x + random(-4, 4);
               this.y = y + random(-4, 4);
               this.vx = random(-3, 3);
               this.vy = random(-3, 3);
               this.size = random(3, 7);
               this.alpha = 255;
           }
           update() { this.x += this.vx; this.y += this.vy; this.alpha -= 10; }
           show() { push(); noStroke(); fill(255, 215, 60, max(this.alpha, 0)); ellipse(this.x, this.y, this.size); pop(); }
           offscreen() { return this.alpha <= 0; }
       }

       class Pipe {
           constructor(previousPipe) {
               let diff = modeDifficulty();
               this.spacing = diff.spacing;
               this.w = width * 0.1;
               this.speed = diff.speed;
               this.passed = false;
               this.stackedHueOffset = random(360);

               const dayPalettes = [
                   [color(110, 200, 60), color(70, 150, 40)],
                   [color(130, 195, 65), color(85, 145, 45)],
                   [color(95, 185, 95), color(55, 135, 65)]
               ];
               const nightPalettes = [
                   [color(58, 72, 92), color(30, 38, 52)],
                   [color(68, 60, 88), color(36, 30, 50)],
                   [color(52, 76, 78), color(26, 42, 44)]
               ];
               const palette = random(midnightMode ? nightPalettes : dayPalettes);
               this.color1 = palette[0];
               this.color2 = palette[1];
               this.highlight = lerpColor(this.color1, color(255, 255, 255), 0.3);
               this.speckleColor = lerpColor(this.color2, color(0, 0, 0), 0.25);

               this.speckles = [];
               let speckleCount = floor(random(3, 6));
               for (let s = 0; s < speckleCount; s++) {
                   this.speckles.push({
                       x: random(this.w * 0.15, this.w * 0.85),
                       onTop: random() < 0.5,
                       t: random(),
                       size: random(3, 7)
                   });
               }

               this.x = width;

               let safeMargin = height * 0.15;

               if (!previousPipe) {
                   let gapCenterY = height / 2;
                   let topMin = gapCenterY - this.spacing / 2 - height * 0.05; 
                   let topMax = gapCenterY - this.spacing / 2 + height * 0.05;
                   this.top = random(topMin, topMax);
               } else {
                   let minTop = safeMargin;
                   let maxTop = height - this.spacing - safeMargin;
                   
                   const maxJump = height * 0.25; 
                   let previousTop = previousPipe.top;
                   
                   minTop = max(minTop, previousTop - maxJump);
                   maxTop = min(maxTop, previousTop + maxJump);

                   if (minTop >= maxTop) { 
                       minTop = safeMargin;
                       maxTop = height - this.spacing - safeMargin;
                   }
                   this.top = random(minTop, maxTop);
               }

               this.bottom = height - (this.top + this.spacing);
           }
           
           show() {
               if (stackedMode) { this.showStacked(); return; }
               noStroke();
               fill(this.color1);
               rect(this.x, 0, this.w, this.top);
               rect(this.x, height - this.bottom, this.w, this.bottom);

               let shadowW = this.w * 0.32;
               fill(this.color2);
               rect(this.x + this.w - shadowW, 0, shadowW, this.top);
               rect(this.x + this.w - shadowW, height - this.bottom, shadowW, this.bottom);

               let hlW = this.w * 0.14;
               fill(this.highlight);
               rect(this.x + this.w * 0.12, 0, hlW, this.top);
               rect(this.x + this.w * 0.12, height - this.bottom, hlW, this.bottom);

               fill(this.speckleColor);
               for (const sp of this.speckles) {
                   let segY = sp.onTop ? sp.t * this.top : (height - this.bottom) + sp.t * this.bottom;
                   ellipse(this.x + sp.x, segY, sp.size);
               }

               if (midnightMode) {
                   fill(255, 255, 255, 28);
                   let sheenW = this.w * 0.08;
                   rect(this.x + this.w * 0.55, 0, sheenW, this.top);
                   rect(this.x + this.w * 0.55, height - this.bottom, sheenW, this.bottom);
               }

               fill(this.color2);
               rect(this.x - 5, this.top - 25, this.w + 10, 25);
               rect(this.x - 5, height - this.bottom, this.w + 10, 25);
           }
           showStacked() {
               push();
               noStroke();
               // outer glow
               fill(stackedColor(this.stackedHueOffset, 85, 100, 55));
               rect(this.x - 6, 0, this.w + 12, this.top);
               rect(this.x - 6, height - this.bottom, this.w + 12, this.bottom);
               // body
               fill(stackedColor(this.stackedHueOffset, 80, 65));
               rect(this.x, 0, this.w, this.top);
               rect(this.x, height - this.bottom, this.w, this.bottom);
               // bright inner core stripe
               fill(stackedColor(this.stackedHueOffset + 40, 55, 100, 220));
               rect(this.x + this.w * 0.34, 0, this.w * 0.32, this.top);
               rect(this.x + this.w * 0.34, height - this.bottom, this.w * 0.32, this.bottom);
               // lip caps
               fill(stackedColor(this.stackedHueOffset + 180, 70, 100));
               rect(this.x - 6, this.top - 22, this.w + 12, 22);
               rect(this.x - 6, height - this.bottom, this.w + 12, 22);
               pop();
           }
           update() { this.x -= this.speed; }
           offscreen() { return this.x < -this.w; }
           hits(bird) { let r = bird.size / 4; if (bird.y - r < this.top || bird.y + r > height - this.bottom) { if (bird.x + r > this.x && bird.x - r < this.x + this.w) { return true; } } return false; }
       }
       
       class Cloud {
           constructor(x, y) {
               this.x = x;
               this.y = y;
               this.speed = random(0.2, 0.8);
               
               if (midnightMode) {
                   this.img = random(nightCloudImgs);
               } else {
                   this.img = random(dayCloudImgs);
               }
               
               this.w = random(width * 0.08, width * 0.15);
               this.h = this.w * (this.img.height / this.img.width);
           }
           
           show() {
               imageMode(CORNER);
               image(this.img, this.x, this.y, this.w, this.h);
           }
           
           update() {
               this.x -= this.speed;
               if (midnightMode) {
                   this.speed *= 1.0005;
               }
               if (this.x < -this.w) {
                   this.x = width + this.w;
                   this.y = random(height * 0.05, height * 0.25);
               }
           }
       }
       
       class Rain {
           constructor(x, y) { this.x = x; this.y = y; this.len = random(14, 26); this.speed = random(9, 17); this.slant = random(2.5, 5); }
           fall() { this.y += this.speed; this.x -= this.slant; }
           show() { stroke(195, 205, 255, 165); strokeWeight(2); line(this.x, this.y, this.x - this.slant * 1.6, this.y + this.len); }
           offscreen() { return this.y > height || this.x < -30; }
       }
       
       class Confetti {
           constructor(x, y) { this.x = x; this.y = y; this.size = random(5, 10); this.color = random([color(255,100,100),color(100,255,100),color(255,255,100),color(100,255,255)]); this.speedY = random(1, 4); this.speedX = random(-2, 2); }
           update() { this.y += this.speedY; this.x += this.speedX; }
           show() { fill(this.color); noStroke(); ellipse(this.x, this.y, this.size); }
           offscreen() { return this.y > height; }
       }

       class ScorePopup {
           constructor(x, y, amount = 5) { this.x = x; this.y = y; this.life = 40; this.alpha = 255; this.amount = amount; }
           update() { this.y -= 1.5; this.life--; this.alpha = map(this.life, 0, 40, 0, 255); }
           show() {
               push();
               textFont('Press Start 2P');
               textSize(20);
               textAlign(CENTER, CENTER);
               fill(255, 255, 255, this.alpha);
               stroke(0, this.alpha);
               strokeWeight(3);
               text(`+${this.amount}`, this.x, this.y);
               pop();
           }
           offscreen() { return this.life <= 0; }
       }

       class ImpactParticle {
           constructor(x, y) {
               this.x = x; this.y = y;
               this.vx = random(-4, 4); this.vy = random(-6, -1);
               this.size = random(4, 9);
               this.alpha = 255;
           }
           update() { this.vy += 0.3; this.x += this.vx; this.y += this.vy; this.alpha -= 8; }
           show() { push(); noStroke(); fill(255, 255, 255, max(this.alpha, 0)); ellipse(this.x, this.y, this.size); pop(); }
           offscreen() { return this.alpha <= 0; }
       }

       class NeonSparkle {
           constructor(x, y) {
               this.x = x + random(-6, 6);
               this.y = y + random(-6, 6);
               this.size = random(3, 7);
               this.alpha = 220;
               this.col = random([color(255, 60, 200), color(255, 120, 220), color(200, 60, 255)]);
           }
           update() { this.alpha -= 12; }
           show() {
               push();
               noStroke();
               fill(red(this.col), green(this.col), blue(this.col), max(this.alpha, 0));
               ellipse(this.x, this.y, this.size);
               pop();
           }
           offscreen() { return this.alpha <= 0; }
       }

       function launchConfetti(x = bird.x, y = bird.y, count = 100) {
           for (let i = 0; i < count; i++) {
               confetti.push(new Confetti(x, y));
           }
       }
</script>
</body>
