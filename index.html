<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Dux-Soup High Fly</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
   <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet">
   <style>
       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           overflow: hidden;
           font-family: 'Inter', sans-serif;
           user-select: none;
           -webkit-user-select: none;
           -webkit-tap-highlight-color: transparent;
           background-color: #000;
       }
       canvas {
           display: block;
           margin: 0;
           z-index: 0;
       }
       .pixel-font {
           font-family: 'Press Start 2P', cursive;
       }
   </style>
</head>
<body>

   <div id="name-modal" class="absolute inset-0 w-full h-full bg-black/50 items-center justify-center z-50 hidden">
       <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 w-11/12 max-w-sm text-center">
           <h2 class="pixel-font text-2xl text-blue-600 dark:text-blue-400 mb-4">New High Score!</h2>
           <p class="mb-4 text-gray-700 dark:text-gray-200">Enter your name for the leaderboard:</p>
           
           <div id="input-container" class="hidden">
                <input type="text" id="name-input" class="w-full p-2 border-2 border-gray-300 rounded-md mb-4" placeholder="Your Name" maxlength="10">
                <button id="submit-score-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
           </div>
           
           <button id="show-keyboard-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">Tap to Enter Name</button>
       </div>
   </div>

<script type="module">
       import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
       import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
       import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

       const firebaseConfig = {
           apiKey: "AIzaSyAn0TNTy9gxmIcr8n90M8yOz3-RyVU8yrU",
           authDomain: "highflygame-1ac8f.firebaseapp.com",
           projectId: "highflygame-1ac8f",
           storageBucket: "highflygame-1ac8f.firebasestorage.app",
           messagingSenderId: "850289020856",
           appId: "1:850289020856:web:211aa43351e86d39fe494d",
           measurementId: "G-02MMXM7KJ9"
       };
       const app = initializeApp(firebaseConfig);
       const auth = getAuth(app);
       const db = getFirestore(app);

       const appId = 'highflygame-1ac8f';

       const nameModal = document.getElementById('name-modal');
       const nameInput = document.getElementById('name-input');
       const submitScoreBtn = document.getElementById('submit-score-btn');
       const showKeyboardBtn = document.getElementById('show-keyboard-btn');
       const inputContainer = document.getElementById('input-container');

       let leaderboardDayRef, leaderboardNightRef;
       let localLeaderboardDay = [];
       let localLeaderboardNight = [];
       let newHighScore = null;

       const handleSubmit = async () => {
           if (!newHighScore) return;
           const name = nameInput.value.trim() || 'Anonymous';
           newHighScore.name = name;
           const isNightMode = newHighScore.isNightMode;
           const relevantLeaderboard = isNightMode ? localLeaderboardNight : localLeaderboardDay;
           const relevantRef = isNightMode ? leaderboardNightRef : leaderboardDayRef;
           const updatedScores = [...relevantLeaderboard, newHighScore].sort((a, b) => b.score - a.score).slice(0, 20);
           try {
               await setDoc(relevantRef, { scores: updatedScores });
           } catch (error) {
               console.error("Error writing to leaderboard: ", error);
           }
           nameModal.classList.add('hidden');
           nameModal.classList.remove('flex');
           newHighScore = null;
           nameInput.value = '';
           // Restore the buttons to the initial state for next time
           inputContainer.classList.add('hidden');
           showKeyboardBtn.classList.remove('hidden');
           window.p5.resetGameAfterScoreSubmit();
           window.p5.loop();
       };

       const checkHighScore = (score, isNightMode) => {
           if (score === 0) return false;
           const relevantLeaderboard = isNightMode ? localLeaderboardNight : localLeaderboardDay;
           const lowestScore = relevantLeaderboard.length > 0 ? relevantLeaderboard[relevantLeaderboard.length - 1].score : 0;
           if (score > lowestScore || relevantLeaderboard.length < 20) {
               newHighScore = { score, isNightMode };
               nameModal.classList.remove('hidden');
               nameModal.classList.add('flex');
               window.p5.noLoop();
               return true;
           }
           return false;
       };
       window.checkHighScore = checkHighScore;

       function setupLeaderboardListeners() {
           let dayDataReceived = false, nightDataReceived = false, initialLoadSignaled = false;
           const signalReady = () => {
               if (dayDataReceived && nightDataReceived && !initialLoadSignaled) {
                   initialLoadSignaled = true;
                   if (window.p5 && typeof window.p5.firebaseReady === 'function') {
                       window.p5.firebaseReady();
                   }
               }
           };
           leaderboardDayRef = doc(db, `artifacts/${appId}/public/data/leaderboard/day_mode`);
           onSnapshot(leaderboardDayRef, (doc) => {
               localLeaderboardDay = doc.exists() ? doc.data().scores || [] : [];
               dayDataReceived = true;
               if (window.p5) window.p5.setLeaderboards(localLeaderboardDay, localLeaderboardNight);
               signalReady();
           });
           leaderboardNightRef = doc(db, `artifacts/${appId}/public/data/leaderboard/night_mode`);
           onSnapshot(leaderboardNightRef, (doc) => {
               localLeaderboardNight = doc.exists() ? doc.data().scores || [] : [];
               nightDataReceived = true;
               if (window.p5) window.p5.setLeaderboards(localLeaderboardDay, localLeaderboardNight);
               signalReady();
           });
       }
       
       // --- EVENT LISTENERS ---
       showKeyboardBtn.addEventListener('click', () => {
           showKeyboardBtn.classList.add('hidden');
           inputContainer.classList.remove('hidden');
           nameInput.focus();
       });

       submitScoreBtn.addEventListener('click', handleSubmit);
       nameInput.addEventListener('keyup', (event) => {
           if (event.key === 'Enter') handleSubmit();
       });
       
       onAuthStateChanged(auth, (user) => {
           if (user) {
               setupLeaderboardListeners();
           } else {
               signInAnonymously(auth);
           }
       });
</script>

<script>
       // Your p5.js game code
       const DEPLOY_VERSION = '1.3.0';
       let bird;
       let birdImg, secretBirdImg, titleImg, sunImg, moonImg;
       let dayCloudImgs = [], nightCloudImgs = [];
       let pipes = [];
       let score = 0;
       let gameState = 'loading';
       let clouds = [];
       let midnightMode = false;
       let rain = [];
       let flashTimer = 0;
       let confetti = [];
       let leaderboardDayData = [];
       let leaderboardNightData = [];
       let bestDayScore = 0;
       let bestNightScore = 0;

       // --- NEW: Easter Egg and Effects variables ---
       let duxTapCount = 0;
       let easterEggActive = false;
       let shakeDuration = 0;
       let shakeAmount = 0;
       let scorePopups = [];
       let impactParticles = [];
       let gameOverAlpha = 0;
       let displayScore = 0;
       let lastScoreWasHighScore = false;

       window.p5 = this;
       
       this.setLeaderboards = (dayData, nightData) => {
           leaderboardDayData = dayData;
           leaderboardNightData = nightData;
       }
       this.resetGameAfterScoreSubmit = () => {
            gameState = 'over';
       }
       this.firebaseReady = () => {
           if (gameState === 'loading') {
               gameState = 'start';
           }
       }
       
       function preload() {
           birdImg = loadImage("https://i.imgur.com/3erQEDH.png");
           secretBirdImg = loadImage("https://i.imgur.com/nkzk9Mn.png"); 
           titleImg = loadImage("https://i.imgur.com/kf0McQi.png");
           sunImg = loadImage("https://i.imgur.com/y9Clgrb.png");
           moonImg = loadImage("https://i.imgur.com/6h9c1qN.png");
           
           dayCloudImgs.push(loadImage("https://i.imgur.com/SOjH8e9.png"));
           nightCloudImgs.push(loadImage("https://i.imgur.com/bmcm6dy.png"));
           nightCloudImgs.push(loadImage("https://i.imgur.com/Fcg1ISx.png"));
       }
       
       function setup() {
           const canvas = createCanvas(windowWidth, windowHeight);
           bird = new Bird();
           bestDayScore = parseInt(localStorage.getItem('duxHighFlyBestDay')) || 0;
           bestNightScore = parseInt(localStorage.getItem('duxHighFlyBestNight')) || 0;
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width), random(height * 0.05, height * 0.25)));
           }
       }
       
       function windowResized() {
           resizeCanvas(windowWidth, windowHeight);
           if (bird) {
                bird.baseY = height / 2;
                bird.reset();
           }
       }
       
       function draw() {
           if (shakeDuration > 0) {
               translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount));
               shakeDuration--;
           }

           if (midnightMode) { 
                background(15, 23, 42); 
                imageMode(CENTER);
                image(moonImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
           } else { 
               background(135, 206, 235); 
           }

           if (gameState === 'loading') {
               drawLoadingScreen();
               return;
           }
           if (!midnightMode) drawScenery(); else drawNightScenery();

           if (gameState === 'start' || gameState === 'play' || gameState === 'over' || gameState === 'entering_name' || gameState === 'leaderboard') {
                for (let cloud of clouds) {
                    cloud.show();
                    if(gameState === 'play') cloud.update();
                }
           }
            
           if (gameState === 'start' || gameState === 'play' || gameState === 'over') {
                for (let c of confetti) { c.show(); c.update(); }
           }


           if (gameState === 'start') {
               bird.hover();
               bird.show();
               drawStartScreen();
           } else if (gameState === 'play') {
               if (midnightMode) {
                   if (random() < 0.01 && flashTimer <= 0) flashTimer = 3;
                   if (flashTimer > 0) { 
                       push();
                       fill(200, 200, 255, 150);
                       noStroke();
                       rectMode(CORNER);
                       rect(0, 0, width, height);
                       pop();
                       flashTimer--; 
                   }
                   for (let i = 0; i < 3; i++) { rain.push(new Rain(random(width), random(-100, 0))); }
                   for (let i = rain.length - 1; i >= 0; i--) { rain[i].fall(); rain[i].show(); if (rain[i].offscreen()) rain.splice(i, 1); }
               }
               for (let p of pipes) { p.show(); }
               bird.show();
               playGame();
               bird.update();
               for (let i = scorePopups.length - 1; i >= 0; i--) {
                   scorePopups[i].update();
                   scorePopups[i].show();
                   if (scorePopups[i].offscreen()) scorePopups.splice(i, 1);
               }
               fill(255);
               stroke(0);
               strokeWeight(4);
               let size = height * 0.05;
               textSize(size);
               textFont('Press Start 2P');
               textAlign(CENTER, TOP);
               text(score, width / 2, 20);
           } else if (gameState === 'over' || gameState === 'entering_name') {
               if (midnightMode) { for (let i = rain.length - 1; i >= 0; i--) { rain[i].show(); } }
               for (let p of pipes) { p.show(); }
               bird.show();
               for (let i = impactParticles.length - 1; i >= 0; i--) {
                   impactParticles[i].update();
                   impactParticles[i].show();
                   if (impactParticles[i].offscreen()) impactParticles.splice(i, 1);
               }
               if (gameState === 'over') {
                   drawGameOverScreen();
               }
           } else if (gameState === 'leaderboard') {
               drawLeaderboardScreen();
           }
       }
       
       function drawLoadingScreen() {
           background(30, 30, 30);
           textAlign(CENTER, CENTER);
           textFont('Press Start 2P');
           textSize(height * 0.05);
           fill(255);
           text('Loading...', width / 2, height / 2);
       }
       
       function drawScenery() {
           fill(34, 139, 34);
           noStroke();
           rect(0, height - 50, width, 50);
           imageMode(CENTER);
           image(sunImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
       }

       function drawNightScenery() {
           fill(16, 20, 30);
           noStroke();
           rect(0, height - 50, width, 50);
       }
       
       function drawStartScreen() {
           if (titleImg) {
               imageMode(CENTER);
               let imgWidth = min(width * 0.8, 500);
               let imgHeight = imgWidth * (titleImg.height / titleImg.width);
               image(titleImg, width / 2, height / 4, imgWidth, imgHeight);
           }

           noStroke();
           fill(255);
           textFont('Inter');
           textSize(max(11, height * 0.017));
           textAlign(CENTER, CENTER);
           text(`Day Best: ${bestDayScore}    Night Best: ${bestNightScore}`, width / 2, height * 0.58);

           let btnWidth = min(width * 0.7, 400);
           let btnHeight = height * 0.08;
           let sBy1 = height * 0.65, sBy2 = height * 0.65 + btnHeight + 20, sBy3 = height * 0.65 + (btnHeight + 20) * 2;
           drawButton("Start Flying", width / 2, sBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy1, btnWidth, btnHeight));
           drawButton("Midnight Flight", width / 2, sBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy2, btnWidth, btnHeight));
           drawButton("Leaderboard", width / 2, sBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy3, btnWidth, btnHeight));

           drawDuxLink();
           
           noStroke();
           fill(255);
           textSize(12);
           textAlign(RIGHT, BOTTOM);
           textFont('Inter');
           text(`v${DEPLOY_VERSION}`, width - 10, height - 10);
       }
       
       function drawGameOverScreen() {
           gameOverAlpha = min(gameOverAlpha + 12, 150);
           fill(0, 0, 0, gameOverAlpha);
           rect(0, 0, width, height);
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);
           let titleSize = height * 0.08;
           textSize(titleSize);
           fill(180, 0, 0);
           stroke(0);
           strokeWeight(2);
           text('Game Over', width/2, height * 0.3);
           noStroke();

           if (lastScoreWasHighScore) {
               let pulse = 200 + sin(frameCount * 0.15) * 55;
               fill(255, pulse, 0);
               textSize(height * 0.03);
               text('NEW HIGH SCORE!', width / 2, height * 0.38);
           }

           fill(255);
           let scoreSize = height * 0.05;
           textSize(scoreSize);
           displayScore += (score - displayScore) * 0.15;
           if (abs(score - displayScore) < 0.5) displayScore = score;
           text(`Score: ${floor(displayScore)}`, width/2, height * 0.45);

           textSize(height * 0.025);
           fill(255, 230);
           let modeBest = midnightMode ? bestNightScore : bestDayScore;
           text(`Best: ${modeBest}`, width/2, height * 0.51);

           let btnWidth = min(width * 0.7, 400);
           let btnHeight = height * 0.08;
           let gBy1 = height * 0.7, gBy2 = height * 0.7 + btnHeight + 20, gBy3 = height * 0.7 + (btnHeight + 20) * 2;
           drawButton("Fly Again", width / 2, gBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy1, btnWidth, btnHeight));
           if (midnightMode) {
               drawButton("Day Flight", width / 2, gBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy2, btnWidth, btnHeight));
           } else {
               drawButton("Midnight Flight", width / 2, gBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy2, btnWidth, btnHeight));
           }
           drawButton("Leaderboard", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));

           drawDuxLink();
       }
       
       function drawLeaderboardColumn(data, startIdx, count, xName, xScore, yStart, entrySize, lineGap) {
           textSize(entrySize);
           fill(255);
           for (let i = 0; i < count; i++) {
               let idx = startIdx + i;
               if (idx >= data.length) break;
               let y = yStart + i * (entrySize + lineGap);
               textAlign(LEFT, CENTER);
               text(`${idx + 1}. ${data[idx].name}`, xName, y);
               textAlign(RIGHT, CENTER);
               text(data[idx].score, xScore, y);
           }
       }

       function drawLeaderboardScreen() {
           fill(0, 0, 0, 150);
           rect(0, 0, width, height);
           textFont('Press Start 2P');
           textAlign(CENTER, CENTER);

           const useVerticalLayout = width < 640;

           if (useVerticalLayout) {
               let leadSize = height * 0.02;
               let entrySize = height * 0.014;
               let lineGap = height * 0.006;

               textSize(leadSize);
               fill(255, 215, 0);
               text('--- DAY FLIGHT ---', width / 2, height * 0.08);
               let dayY = height * 0.12;
               drawLeaderboardColumn(leaderboardDayData, 0, 10, width * 0.08, width * 0.46, dayY, entrySize, lineGap);
               drawLeaderboardColumn(leaderboardDayData, 10, 10, width * 0.54, width * 0.92, dayY, entrySize, lineGap);

               textSize(leadSize);
               fill(255, 215, 0);
               text('--- MIDNIGHT FLIGHT ---', width / 2, height * 0.46);
               let nightY = height * 0.5;
               drawLeaderboardColumn(leaderboardNightData, 0, 10, width * 0.08, width * 0.46, nightY, entrySize, lineGap);
               drawLeaderboardColumn(leaderboardNightData, 10, 10, width * 0.54, width * 0.92, nightY, entrySize, lineGap);

           } else {
               let leadSize = height * 0.025;
               let entrySize = height * 0.018;
               let lineGap = height * 0.008;

               textSize(leadSize);
               fill(255, 215, 0);
               text('--- DAY FLIGHT ---', width * 0.25, height * 0.13);
               text('--- MIDNIGHT FLIGHT ---', width * 0.75, height * 0.13);

               let entryY = height * 0.19;
               drawLeaderboardColumn(leaderboardDayData, 0, 10, width * 0.06, width * 0.23, entryY, entrySize, lineGap);
               drawLeaderboardColumn(leaderboardDayData, 10, 10, width * 0.27, width * 0.44, entryY, entrySize, lineGap);
               drawLeaderboardColumn(leaderboardNightData, 0, 10, width * 0.56, width * 0.73, entryY, entrySize, lineGap);
               drawLeaderboardColumn(leaderboardNightData, 10, 10, width * 0.77, width * 0.94, entryY, entrySize, lineGap);
           }

           let btnWidth = min(width * 0.7, 400);
           let btnHeight = height * 0.08;
           let backY = height * 0.9;
           drawButton("Back", width / 2, backY, btnWidth, btnHeight, isMouseOverRect(width / 2, backY, btnWidth, btnHeight));

           drawDuxLink();
       }
       
       function getLinkTextSize() {
           return max(12, height * 0.018);
       }

       // --- UPDATED: Responsive link positioning ---
       function drawDuxLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           const isHovering = isMouseOverLink();
           const linkColor = isHovering ? color(255, 255, 255) : color(200, 220, 255);
           
           fill(linkColor);
           noStroke();
           textFont('Inter');
           textSize(size);

           let x, y, linkW;
           const isPortrait = width < height;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                let btnHeight = height * 0.08;
                if (gameState === 'start') {
                    y = height * 0.65 + (btnHeight + 20) * 2 + btnHeight / 2 + 30;
                } else if (gameState === 'over') {
                    y = height * 0.7 + (btnHeight + 20) * 2 + btnHeight / 2 + 30;
                } else { // Leaderboard
                    y = height * 0.9 + btnHeight / 2 + 30;
                }
                x = width / 2;
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW / 2, y + size / 2 + 2, x + linkW / 2, y + size / 2 + 2);
                }
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40; 
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW, y + 2, x, y + 2);
                }
           }
       }

       function isMouseOverLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           textFont('Inter');
           textSize(size);

           const isPortrait = width < height;
           let x, y, linkW, linkH;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                let btnHeight = height * 0.08;
                if (gameState === 'start') {
                    y = height * 0.65 + (btnHeight + 20) * 2 + btnHeight / 2 + 30;
                } else if (gameState === 'over') {
                    y = height * 0.7 + (btnHeight + 20) * 2 + btnHeight / 2 + 30;
                } else { // Leaderboard
                    y = height * 0.9 + btnHeight / 2 + 30;
                }
                x = width / 2;
                linkW = textWidth(linkText);
                linkH = size * 2;
                return (mouseX > x - linkW / 2 && mouseX < x + linkW / 2 &&
                        mouseY > y - linkH / 2 && mouseY < y + linkH / 2);
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40;
                linkW = textWidth(linkText);
                linkH = size * 1.5; 
                return (mouseX > x - linkW && mouseX < x &&
                        mouseY > y - linkH && mouseY < y);
           }
       }
       
       function isMouseOverRect(x, y, w, h) {
           return mouseX > x - w / 2 && mouseX < x + w / 2 && mouseY > y - h / 2 && mouseY < y + h / 2;
       }

       function drawButton(txt, x, y, w, h, hovered = false) {
           let by = y + (hovered ? -2 : 0);
           stroke(255);
           strokeWeight(3);
           fill(hovered ? color(100, 140, 255) : color(60, 100, 255));
           rectMode(CENTER);
           rect(x, by, w, h, 10);
           fill(255);
           noStroke();
           textFont('Inter');
           textSize(h * 0.4);
           textAlign(CENTER, CENTER);
           text(txt, x, by);
           rectMode(CORNER);
       }
       
       function playGame() {
           let interval = midnightMode ? max(30, 70 - floor(score / 10)) : 90;
            if (frameCount % interval === 0) {
               let lastPipe = pipes.length > 0 ? pipes[pipes.length - 1] : null;
               pipes.push(new Pipe(lastPipe));
           }
           for (let i = pipes.length - 1; i >= 0; i--) {
               pipes[i].update();
               if (pipes[i].hits(bird)) {
                   endGame();
               }
               if (!pipes[i].passed && pipes[i].x + pipes[i].w < bird.x) {
                   pipes[i].passed = true;
                   score += 5;
                   scorePopups.push(new ScorePopup(bird.x, bird.y - bird.size * 0.7));
                   if (score > 0 && score % 50 === 0) launchConfetti();
               }
               if (pipes[i].offscreen()) {
                   pipes.splice(i, 1);
               }
           }
           if (bird.y > height - bird.size / 2 || bird.y < bird.size / 2) {
               endGame();
           }
       }
       
       function endGame() {
           if (gameState === 'over' || gameState === 'entering_name') return;
           
           shakeDuration = 20;
           shakeAmount = 8;
           easterEggActive = false;
           gameOverAlpha = 0;
           displayScore = 0;
           for (let i = 0; i < 24; i++) {
               impactParticles.push(new ImpactParticle(bird.x, bird.y));
           }

           if (midnightMode) {
               if (score > bestNightScore) {
                   bestNightScore = score;
                   localStorage.setItem('duxHighFlyBestNight', bestNightScore);
               }
           } else {
               if (score > bestDayScore) {
                   bestDayScore = score;
                   localStorage.setItem('duxHighFlyBestDay', bestDayScore);
               }
           }

           if (window.checkHighScore(score, midnightMode)) {
               lastScoreWasHighScore = true;
               gameState = 'entering_name';
           } else {
               lastScoreWasHighScore = false;
               gameState = 'over';
           }
       }
       
       function mousePressed() {
           if (gameState === 'entering_name') {
               return;
           }
           
           if (gameState === 'start' || gameState === 'over' || gameState === 'leaderboard') {
               if (isMouseOverLink()) {
                   window.open('https://www.dux-soup.com/', '_blank');
                   return; 
               }
           }

           if (gameState === 'start') {
               let d = dist(mouseX, mouseY, bird.x, bird.y);
               if (d < bird.size / 2) {
                   duxTapCount++;
                   if (duxTapCount === 5) {
                       easterEggActive = true;
                       launchConfetti(width / 2, height / 2, 200); 
                       duxTapCount = 0; 
                   }
               }
           }

           handleInput();
           return false;
       }

       function keyPressed() {
           if (key === ' ') {
               if (gameState === 'play') {
                   bird.up();
               }
           }
       }

       function handleInput() {
           if (gameState === 'play') {
               bird.up();
               return;
           }
           
           if (gameState === 'entering_name') return;

           let btnWidth, btnHeight;
           if (gameState === 'start') {
               btnWidth = min(width * 0.7, 400);
               btnHeight = height * 0.08;
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.65 - btnHeight/2 && mouseY < height*0.65 + btnHeight/2) {
                   midnightMode = false;
                   startGame();
               }
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.65 + btnHeight + 20 - btnHeight/2 && mouseY < height*0.65 + btnHeight + 20 + btnHeight/2) {
                   midnightMode = true;
                   startGame();
               }
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.65 + (btnHeight + 20) * 2 - btnHeight/2 && mouseY < height*0.65 + (btnHeight + 20) * 2 + btnHeight/2) {
                   gameState = 'leaderboard';
               }
           } else if (gameState === 'over') {
               btnWidth = min(width * 0.7, 400);
               btnHeight = height * 0.08;
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.7 - btnHeight/2 && mouseY < height*0.7 + btnHeight/2) {
                   startGame();
               }
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.7 + btnHeight + 20 - btnHeight/2 && mouseY < height*0.7 + btnHeight + 20 + btnHeight/2) {
                   midnightMode = !midnightMode;
                   startGame();
               }
                if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.7 + (btnHeight + 20) * 2 - btnHeight/2 && mouseY < height*0.7 + (btnHeight + 20) * 2 + btnHeight/2) {
                   gameState = 'leaderboard';
               }
           } else if (gameState === 'leaderboard') {
               btnWidth = min(width * 0.7, 400);
               btnHeight = height * 0.08;
               if (mouseX > width/2 - btnWidth/2 && mouseX < width/2 + btnWidth/2 && mouseY > height*0.9 - btnHeight/2 && mouseY < height*0.9 + btnHeight/2) {
                   gameState = 'start';
               }
           }
       }
       
       function startGame() {
           gameState = 'play';
           pipes = [];
           confetti = [];
           scorePopups = [];
           impactParticles = [];
           gameOverAlpha = 0;
           displayScore = 0;
           lastScoreWasHighScore = false;
           score = 0;
           bird.reset();
           pipes.push(new Pipe(null));
           clouds = [];
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width, width * 1.5), random(height * 0.05, height * 0.25)));
           }
       }
       
       class Bird {
           constructor() { this.size = height * 0.08; this.reset(); }
           reset() { this.size = height * 0.08; this.x = width / 4; this.y = height / 2; this.gravity = 0.0005 * height; this.lift = -0.012 * height; this.velocity = 0; this.baseY = height / 2; }
           update() { this.velocity += this.gravity; this.velocity *= 0.98; this.y += this.velocity; }
           hover() { this.x = width / 2; this.y = this.baseY + sin(frameCount * 0.05) * 10; this.velocity = 0; }
           show() {
               let imgToShow = easterEggActive ? secretBirdImg : birdImg;
               push();
               translate(this.x, this.y);
               let angle = map(this.velocity, -10, 15, -PI / 4, PI / 4);
               if (gameState !== 'play') angle = 0;
               rotate(angle);
               imageMode(CENTER);
               if (gameState === 'play') {
                   let squashY = map(constrain(this.velocity, -10, 15), -10, 15, 0.82, 1.15);
                   scale(2 - squashY, squashY);
               }
               image(imgToShow, 0, 0, this.size, this.size);
               pop();
            }
           up() { this.velocity = this.lift; }
       }
       
       class Pipe {
           constructor(previousPipe) {
               this.spacing = midnightMode ? height * 0.28 : height * 0.35;
               this.w = width * 0.1;
               this.speed = midnightMode ? width * 0.0065 : width * 0.005;
               this.passed = false;

               const dayPalettes = [
                   [color(110, 200, 60), color(70, 150, 40)],
                   [color(130, 195, 65), color(85, 145, 45)],
                   [color(95, 185, 95), color(55, 135, 65)]
               ];
               const nightPalettes = [
                   [color(58, 72, 92), color(30, 38, 52)],
                   [color(68, 60, 88), color(36, 30, 50)],
                   [color(52, 76, 78), color(26, 42, 44)]
               ];
               const palette = random(midnightMode ? nightPalettes : dayPalettes);
               this.color1 = palette[0];
               this.color2 = palette[1];
               this.highlight = lerpColor(this.color1, color(255, 255, 255), 0.3);
               this.speckleColor = lerpColor(this.color2, color(0, 0, 0), 0.25);

               this.speckles = [];
               let speckleCount = floor(random(3, 6));
               for (let s = 0; s < speckleCount; s++) {
                   this.speckles.push({
                       x: random(this.w * 0.15, this.w * 0.85),
                       onTop: random() < 0.5,
                       t: random(),
                       size: random(3, 7)
                   });
               }

               this.x = width;

               let safeMargin = height * 0.15;

               if (!previousPipe) {
                   let gapCenterY = height / 2;
                   let topMin = gapCenterY - this.spacing / 2 - height * 0.05; 
                   let topMax = gapCenterY - this.spacing / 2 + height * 0.05;
                   this.top = random(topMin, topMax);
               } else {
                   let minTop = safeMargin;
                   let maxTop = height - this.spacing - safeMargin;
                   
                   const maxJump = height * 0.25; 
                   let previousTop = previousPipe.top;
                   
                   minTop = max(minTop, previousTop - maxJump);
                   maxTop = min(maxTop, previousTop + maxJump);

                   if (minTop >= maxTop) { 
                       minTop = safeMargin;
                       maxTop = height - this.spacing - safeMargin;
                   }
                   this.top = random(minTop, maxTop);
               }

               this.bottom = height - (this.top + this.spacing);
           }
           
           show() {
               noStroke();
               fill(this.color1);
               rect(this.x, 0, this.w, this.top);
               rect(this.x, height - this.bottom, this.w, this.bottom);

               let shadowW = this.w * 0.32;
               fill(this.color2);
               rect(this.x + this.w - shadowW, 0, shadowW, this.top);
               rect(this.x + this.w - shadowW, height - this.bottom, shadowW, this.bottom);

               let hlW = this.w * 0.14;
               fill(this.highlight);
               rect(this.x + this.w * 0.12, 0, hlW, this.top);
               rect(this.x + this.w * 0.12, height - this.bottom, hlW, this.bottom);

               fill(this.speckleColor);
               for (const sp of this.speckles) {
                   let segY = sp.onTop ? sp.t * this.top : (height - this.bottom) + sp.t * this.bottom;
                   ellipse(this.x + sp.x, segY, sp.size);
               }

               if (midnightMode) {
                   fill(255, 255, 255, 28);
                   let sheenW = this.w * 0.08;
                   rect(this.x + this.w * 0.55, 0, sheenW, this.top);
                   rect(this.x + this.w * 0.55, height - this.bottom, sheenW, this.bottom);
               }

               fill(this.color2);
               rect(this.x - 5, this.top - 25, this.w + 10, 25);
               rect(this.x - 5, height - this.bottom, this.w + 10, 25);
           }
           update() { this.x -= this.speed; if (midnightMode) { this.speed *= 1.0005; } }
           offscreen() { return this.x < -this.w; }
           hits(bird) { let r = bird.size / 4; if (bird.y - r < this.top || bird.y + r > height - this.bottom) { if (bird.x + r > this.x && bird.x - r < this.x + this.w) { return true; } } return false; }
       }
       
       class Cloud {
           constructor(x, y) {
               this.x = x;
               this.y = y;
               this.speed = random(0.2, 0.8);
               
               if (midnightMode) {
                   this.img = random(nightCloudImgs);
               } else {
                   this.img = random(dayCloudImgs);
               }
               
               this.w = random(width * 0.08, width * 0.15);
               this.h = this.w * (this.img.height / this.img.width);
           }
           
           show() {
               imageMode(CORNER);
               image(this.img, this.x, this.y, this.w, this.h);
           }
           
           update() {
               this.x -= this.speed;
               if (midnightMode) {
                   this.speed *= 1.0005;
               }
               if (this.x < -this.w) {
                   this.x = width + this.w;
                   this.y = random(height * 0.05, height * 0.25);
               }
           }
       }
       
       class Rain {
           constructor(x, y) { this.x = x; this.y = y; this.len = random(10, 20); this.speed = random(6, 12); }
           fall() { this.y += this.speed; }
           show() { stroke(200, 200, 255, 150); strokeWeight(2); line(this.x, this.y, this.x, this.y + this.len); }
           offscreen() { return this.y > height; }
       }
       
       class Confetti {
           constructor(x, y) { this.x = x; this.y = y; this.size = random(5, 10); this.color = random([color(255,100,100),color(100,255,100),color(255,255,100),color(100,255,255)]); this.speedY = random(1, 4); this.speedX = random(-2, 2); }
           update() { this.y += this.speedY; this.x += this.speedX; }
           show() { fill(this.color); noStroke(); ellipse(this.x, this.y, this.size); }
           offscreen() { return this.y > height; }
       }

       class ScorePopup {
           constructor(x, y) { this.x = x; this.y = y; this.life = 40; this.alpha = 255; }
           update() { this.y -= 1.5; this.life--; this.alpha = map(this.life, 0, 40, 0, 255); }
           show() {
               push();
               textFont('Press Start 2P');
               textSize(20);
               textAlign(CENTER, CENTER);
               fill(255, 255, 255, this.alpha);
               stroke(0, this.alpha);
               strokeWeight(3);
               text('+5', this.x, this.y);
               pop();
           }
           offscreen() { return this.life <= 0; }
       }

       class ImpactParticle {
           constructor(x, y) {
               this.x = x; this.y = y;
               this.vx = random(-4, 4); this.vy = random(-6, -1);
               this.size = random(4, 9);
               this.alpha = 255;
           }
           update() { this.vy += 0.3; this.x += this.vx; this.y += this.vy; this.alpha -= 8; }
           show() { push(); noStroke(); fill(255, 255, 255, max(this.alpha, 0)); ellipse(this.x, this.y, this.size); pop(); }
           offscreen() { return this.alpha <= 0; }
       }

       function launchConfetti(x = bird.x, y = bird.y, count = 100) {
           for (let i = 0; i < count; i++) {
               confetti.push(new Confetti(x, y));
           }
       }
</script>
