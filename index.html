<script type="module">
       import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
       import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
       import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

       const firebaseConfig = {
           apiKey: "AIzaSyAn0TNTy9gxmIcr8n90M8yOz3-RyVU8yrU",
           authDomain: "highflygame-1ac8f.firebaseapp.com",
           projectId: "highflygame-1ac8f",
           storageBucket: "highflygame-1ac8f.firebasestorage.app",
           messagingSenderId: "850289020856",
           appId: "1:850289020856:web:211aa43351e86d39fe494d",
           measurementId: "G-02MMXM7KJ9"
       };
       const app = initializeApp(firebaseConfig);
       const auth = getAuth(app);
       const db = getFirestore(app);

       const appId = 'highflygame-1ac8f';

       const nameModal = document.getElementById('name-modal');
       const nameInput = document.getElementById('name-input');
       const submitScoreBtn = document.getElementById('submit-score-btn');
       const showKeyboardBtn = document.getElementById('show-keyboard-btn');
       const skipScoreBtn = document.getElementById('skip-score-btn');
       const inputContainer = document.getElementById('input-container');

       let leaderboardDayRef, leaderboardNightRef, leaderboardStackedRef;
       let localLeaderboardDay = [];
       let localLeaderboardNight = [];
       let localLeaderboardStacked = [];
       let newHighScore = null;
       // Which boards have actually arrived from Firestore. A board that never
       // loaded (slow or blocked network) looks empty, and writing to it would
       // replace the real leaderboard with a single score - so we never offer
       // a high-score entry for a board we haven't received.
       const received = { day: false, night: false, stacked: false };
       let submitting = false;

       const listForMode = (mode) =>
           mode === 'stacked' ? localLeaderboardStacked : (mode === 'night' ? localLeaderboardNight : localLeaderboardDay);
       const refForMode = (mode) =>
           mode === 'stacked' ? leaderboardStackedRef : (mode === 'night' ? leaderboardNightRef : leaderboardDayRef);

       const closeModal = () => {
           nameModal.classList.add('hidden');
           nameModal.classList.remove('flex');
           newHighScore = null;
           nameInput.value = '';
           nameInput.blur();
           // Restore the buttons to the initial state for next time
           inputContainer.classList.add('hidden');
           showKeyboardBtn.classList.remove('hidden');
           window.p5.resetGameAfterScoreSubmit();
           window.p5.loop();
       };

       const handleSubmit = async () => {
           if (!newHighScore || submitting) return;
           submitting = true;
           const name = nameInput.value.trim() || 'Anonymous';
           newHighScore.name = name;
           const mode = newHighScore.mode;
           const relevantLeaderboard = listForMode(mode);
           const relevantRef = refForMode(mode);
           const updatedScores = [...relevantLeaderboard, newHighScore].sort((a, b) => b.score - a.score).slice(0, 20);
           try {
               await setDoc(relevantRef, { scores: updatedScores });
           } catch (error) {
               console.error("Error writing to leaderboard: ", error);
           }
           submitting = false;
           closeModal();
       };

       const checkHighScore = (score, mode) => {
           if (score === 0) return false;
           if (!received[mode]) return false;
           const relevantLeaderboard = listForMode(mode);
           const lowestScore = relevantLeaderboard.length > 0 ? relevantLeaderboard[relevantLeaderboard.length - 1].score : 0;
           if (score > lowestScore || relevantLeaderboard.length < 20) {
               newHighScore = { score, mode };
               nameModal.classList.remove('hidden');
               nameModal.classList.add('flex');
               window.p5.noLoop();
               return true;
           }
           return false;
       };
       window.checkHighScore = checkHighScore;

       function setupLeaderboardListeners() {
           let initialLoadSignaled = false;
           const push = () => {
               if (window.p5) window.p5.setLeaderboards(localLeaderboardDay, localLeaderboardNight, localLeaderboardStacked);
           };
           const signalReady = () => {
               if (received.day && received.night && received.stacked && !initialLoadSignaled) {
                   initialLoadSignaled = true;
                   if (window.p5 && typeof window.p5.firebaseReady === 'function') {
                       window.p5.firebaseReady();
                   }
               }
           };
           leaderboardDayRef = doc(db, `artifacts/${appId}/public/data/leaderboard/day_mode`);
           onSnapshot(leaderboardDayRef, (doc) => {
               localLeaderboardDay = doc.exists() ? doc.data().scores || [] : [];
               received.day = true;
               push();
               signalReady();
           });
           leaderboardNightRef = doc(db, `artifacts/${appId}/public/data/leaderboard/night_mode`);
           onSnapshot(leaderboardNightRef, (doc) => {
               localLeaderboardNight = doc.exists() ? doc.data().scores || [] : [];
               received.night = true;
               push();
               signalReady();
           });
           leaderboardStackedRef = doc(db, `artifacts/${appId}/public/data/leaderboard/stacked_mode`);
           onSnapshot(leaderboardStackedRef, (doc) => {
               localLeaderboardStacked = doc.exists() ? doc.data().scores || [] : [];
               received.stacked = true;
               push();
               signalReady();
           });
       }

       // --- EVENT LISTENERS ---
       showKeyboardBtn.addEventListener('click', () => {
           showKeyboardBtn.classList.add('hidden');
           inputContainer.classList.remove('hidden');
           nameInput.focus();
       });

       submitScoreBtn.addEventListener('click', handleSubmit);
       skipScoreBtn.addEventListener('click', () => { if (!submitting) closeModal(); });
       nameInput.addEventListener('keyup', (event) => {
           if (event.key === 'Enter') handleSubmit();
       });

       onAuthStateChanged(auth, (user) => {
           if (user) {
               setupLeaderboardListeners();
           } else {
               signInAnonymously(auth);
           }
       });
</script>

<script>
       // Your p5.js game code
       const DEPLOY_VERSION = '1.14.0';
       const SHARE_URL = 'https://highflygame-1ac8f.web.app/';
       // p5 drops the font name straight into the canvas font string. Unquoted,
       // "Press Start 2P" is invalid CSS (a name part can't start with a
       // digit), so the browser silently ignored it and every pixel-font title
       // fell back to 12px sans-serif. Quoting it fixes that.
       const PIXEL_FONT = '"Press Start 2P", monospace';
       // Canvas text doesn't trigger a web font download on its own, so ask for
       // both fonts up front.
       try {
           document.fonts.load('20px "Press Start 2P"');
           document.fonts.load('20px "Inter"');
           document.fonts.load('bold 20px "Inter"');
       } catch (e) {}
       let bird;
       let birdImg, secretBirdImg, titleImg, sunImg, moonImg;
       let dayCloudImgs = [], nightCloudImgs = [];
       let pipes = [];
       let score = 0;
       let gameState = 'loading';
       let clouds = [];
       let midnightMode = false;
       let rain = [];
       let flashTimer = 0;
       let confetti = [];
       let leaderboardDayData = [];
       let leaderboardNightData = [];
       let leaderboardStackedData = [];
       let leaderboardTab = 'day';
       let bestDayScore = 0;
       let bestNightScore = 0;

       // --- NEW: Easter Egg and Effects variables ---
       let duxTapCount = 0;
       // Tapping the menu duck 5x toggles "star mode": a rapid rainbow strobe
       // on top of whichever duck the current mode uses.
       let starMode = false;
       let shakeDuration = 0;
       let shakeAmount = 0;
       let scorePopups = [];
       let impactParticles = [];
       let neonTrail = [];
       let gameOverAlpha = 0;
       let displayScore = 0;
       let lastScoreWasHighScore = false;
       let lastRunWasPersonalBest = false;
       // Brief input freeze after dying, so the tap that killed you (or panic
       // tapping) can't immediately trigger "Fly Again".
       let overInputLock = 0;

       // --- Shield power-up state ---
       let powerUp = null;
       let hasShield = false;
       let shieldGraceFrames = 0;
       let shieldFlashTimer = 0;
       let shieldParticles = [];

       // --- STACKED mode ---
       let stackedMode = false;
       let stackedHue = 0;
       let hazards = [];
       let stackedShapes = [];
       let bestStackedScore = 0;

       // --- Fixed-step timing ---
       // Physics used to advance once per drawn frame, so on 120Hz phones
       // (recent iPhones, most flagship Androids) the whole game ran at double
       // speed. The frame rate is now capped at 60 and the simulation advances
       // in fixed 60Hz steps, catching up on slower phones instead of slowing
       // down.
       const SIM_STEP_MS = 1000 / 60;
       let simAcc = 0;
       let simFrame = 0;

       // --- Little UI bits ---
       let toastText = '';
       let toastTimer = 0;
       const CORNER_BTN = 40;

       // Menu backdrop cycles day -> midnight -> stacked. Themes are rendered
       // into offscreen buffers so one can crossfade over the other.
       const MENU_THEMES = ['day', 'night', 'stacked'];
       const MENU_HOLD = 300;
       const MENU_FADE = 70;
       let menuBufA = null, menuBufB = null;
       let starBuf = null;

       function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
       function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

       // --- Sound effects ---
       // Synthesised with Web Audio, so there are no sound files to load. The
       // audio context can only start inside a tap, so every press calls
       // Sfx.unlock(). iPhones also respect the ring/silent switch.
       const Sfx = (() => {
           let ctx = null, master = null, noiseBuf = null;
           let muted = safeGet('duxHighFlyMuted') === '1';

           function unlock() {
               try {
                   if (!ctx) {
                       const AC = window.AudioContext || window.webkitAudioContext;
                       if (!AC) return;
                       ctx = new AC();
                       master = ctx.createGain();
                       master.gain.value = 0.32;
                       master.connect(ctx.destination);
                       noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
                       const d = noiseBuf.getChannelData(0);
                       for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                   }
                   if (ctx.state === 'suspended') ctx.resume();
               } catch (e) {}
           }

           function tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0) {
               if (muted || !ctx || ctx.state !== 'running') return;
               try {
                   const t = ctx.currentTime + delay;
                   const o = ctx.createOscillator();
                   const g = ctx.createGain();
                   o.type = type;
                   o.frequency.setValueAtTime(freq, t);
                   if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                   g.gain.setValueAtTime(vol, t);
                   g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
                   o.connect(g);
                   g.connect(master);
                   o.start(t);
                   o.stop(t + dur + 0.03);
               } catch (e) {}
           }

           function noise(dur, vol = 0.3, cutoff = 1200) {
               if (muted || !ctx || ctx.state !== 'running' || !noiseBuf) return;
               try {
                   const t = ctx.currentTime;
                   const src = ctx.createBufferSource();
                   src.buffer = noiseBuf;
                   const f = ctx.createBiquadFilter();
                   f.type = 'lowpass';
                   f.frequency.setValueAtTime(cutoff, t);
                   f.frequency.exponentialRampToValueAtTime(120, t + dur);
                   const g = ctx.createGain();
                   g.gain.setValueAtTime(vol, t);
                   g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
                   src.connect(f);
                   f.connect(g);
                   g.connect(master);
                   src.start(t);
                   src.stop(t + dur + 0.03);
               } catch (e) {}
           }

           return {
               unlock,
               isMuted: () => muted,
               toggle() {
                   muted = !muted;
                   safeSet('duxHighFlyMuted', muted ? '1' : '0');
                   if (!muted) { unlock(); tone(660, 0.08, 'square', 0.15); tone(990, 0.1, 'square', 0.15, null, 0.07); }
               },
               flap() { tone(380, 0.09, 'triangle', 0.22, 640); },
               score() { tone(988, 0.06, 'square', 0.09); tone(1319, 0.09, 'square', 0.09, null, 0.055); },
               milestone() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.09, 'square', 0.1, null, i * 0.06)); },
               pickup() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.08, 'triangle', 0.22, null, i * 0.045)); },
               shieldBreak() { tone(700, 0.22, 'sawtooth', 0.12, 160); noise(0.18, 0.22, 2500); },
               laser() { tone(180, 0.35, 'sawtooth', 0.07, 360); },
               hit() { noise(0.35, 0.45, 1800); tone(220, 0.4, 'square', 0.16, 55); },
               best() { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'square', 0.11, null, 0.35 + i * 0.09)); }
           };
       })();

       function buzz(pattern) {
           if (Sfx.isMuted() || !navigator.vibrate) return;
           try { navigator.vibrate(pattern); } catch (e) {}
       }

       function showToast(msg) {
           toastText = msg;
           toastTimer = 110;
       }

       window.p5 = this;

       this.setLeaderboards = (dayData, nightData, stackedData) => {
           leaderboardDayData = dayData;
           leaderboardNightData = nightData;
           leaderboardStackedData = stackedData || [];
       }
       this.resetGameAfterScoreSubmit = () => {
            gameState = 'over';
       }
       this.firebaseReady = () => {
           if (gameState === 'loading') {
               gameState = 'start';
           }
       }

       // All art is served from this project. It used to load from imgur,
       // which put every image behind a third-party host the game has no
       // control over - if it rate-limited or went down, the game broke.
       function preload() {
           birdImg = loadImage("assets/dux.png");
           secretBirdImg = loadImage("assets/dux-magenta.png");
           titleImg = loadImage("assets/title.png");
           sunImg = loadImage("assets/sun.png");
           moonImg = loadImage("assets/moon.png");

           dayCloudImgs.push(loadImage("assets/cloud-day.png"));
           nightCloudImgs.push(loadImage("assets/cloud-night-1.png"));
           nightCloudImgs.push(loadImage("assets/cloud-night-2.png"));
       }

       function setup() {
           // Phones report 3x pixel density; rendering a full-screen canvas at
           // 3x (plus two menu buffers) is a lot of fill for a mid-range phone.
           // 2x is visually identical for this art and much lighter.
           pixelDensity(min(2, displayDensity()));
           frameRate(60);
           const canvas = createCanvas(windowWidth, windowHeight);
           canvas.elt.addEventListener('contextmenu', (e) => e.preventDefault());
           menuBufA = createGraphics(windowWidth, windowHeight);
           menuBufB = createGraphics(windowWidth, windowHeight);
           // The menu backdrop is soft art behind the UI, so 1x is plenty.
           try { menuBufA.pixelDensity(1); menuBufB.pixelDensity(1); } catch (e) {}
           starBuf = createGraphics(256, 256);
           bird = new Bird();
           bestDayScore = parseInt(safeGet('duxHighFlyBestDay')) || 0;
           bestNightScore = parseInt(safeGet('duxHighFlyBestNight')) || 0;
           // Fall back to the old key so a returning player's personal best
           // does not silently reset to 0 after the RUSH -> STACKED rename.
           bestStackedScore = parseInt(safeGet('duxHighFlyBestStacked')) || parseInt(safeGet('duxHighFlyBestRush')) || 0;
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width), random(height * 0.05, height * 0.25)));
           }

           // If the leaderboard is slow or blocked (patchy mobile data, strict
           // office wifi), don't leave people stuck on "Loading...". The game
           // still works; scores just won't be offered to the board until it
           // arrives.
           setTimeout(() => { if (gameState === 'loading') gameState = 'start'; }, 4500);

           // Switching apps or locking the phone mid-run pauses instead of
           // letting the duck fall while nobody is looking.
           document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
           window.addEventListener('blur', pauseGame);
       }

       function windowResized() {
           let oldW = width, oldH = height;
           resizeCanvas(windowWidth, windowHeight);
           if (menuBufA) menuBufA.resizeCanvas(windowWidth, windowHeight);
           if (menuBufB) menuBufB.resizeCanvas(windowWidth, windowHeight);
           if (!bird) return;

           let inRun = gameState === 'play' || gameState === 'paused' || gameState === 'ready';
           if (!inRun) {
               bird.baseY = height / 2;
               bird.reset();
               return;
           }

           // Mid-run resize (browser toolbar showing/hiding, rotating the
           // phone). This used to snap the duck back to the middle of the
           // screen. Instead, scale the whole scene so everything stays where
           // it was relative to the screen.
           let rx = oldW > 0 ? width / oldW : 1;
           let ry = oldH > 0 ? height / oldH : 1;
           let velScale = ry;
           bird.size = height * 0.08;
           bird.x = width / 4;
           bird.y *= ry;
           bird.baseY = height / 2;
           bird.gravity = 0.0005 * height;
           bird.lift = -0.012 * height;
           bird.velocity *= velScale;
           for (let p of pipes) {
               p.x *= rx;
               p.w = width * 0.1;
               p.speed *= rx;
               p.top *= ry;
               p.spacing *= ry;
               p.bottom = height - (p.top + p.spacing);
           }
           for (let hz of hazards) {
               hz.y *= ry;
               hz.thickness = height * 0.05;
           }
           if (powerUp) {
               powerUp.x *= rx;
               powerUp.y *= ry;
               powerUp.size = height * 0.05;
               powerUp.speed *= rx;
           }
           // A rotation is a big change; give the player a beat to re-grip.
           if (gameState === 'play' && abs(rx - 1) > 0.15) pauseGame();
       }

       function pauseGame() {
           if (gameState === 'play') {
               gameState = 'paused';
           }
       }

       function resumeGame() {
           if (gameState !== 'paused') return;
           gameState = 'play';
           simAcc = 0;
           bird.up();
       }

       function beginFlight() {
           if (gameState !== 'ready') return;
           gameState = 'play';
           simAcc = 0;
           simFrame = 0;
           bird.up();
       }

       // Run one fixed 60Hz step of the actual game (no drawing).
       function simulateStep() {
           playGame();
           if (gameState === 'play') bird.update();
       }

       function draw() {
           // Work out how many fixed steps this frame represents. At 60fps
           // that's 1; a phone struggling at 30fps gets 2 so the game keeps
           // its speed. The first step happens in the normal play branch
           // below (which updates and draws together); any extra catch-up
           // steps run here first.
           let simSteps = 1;
           if (gameState === 'play') {
               simAcc += min(deltaTime, 100);
               simSteps = constrain(floor((simAcc + 4) / SIM_STEP_MS), 1, 4);
               simAcc = constrain(simAcc - simSteps * SIM_STEP_MS, -8, SIM_STEP_MS);
               for (let s = 1; s < simSteps && gameState === 'play'; s++) simulateStep();
           }

           push();
           if (shakeDuration > 0) {
               translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount));
               shakeDuration--;
           }

           if (gameState === 'start') {
               // Menu shows its own cycling backdrop rather than any one mode.
               drawMenuBackground();
           } else if (stackedMode) {
               drawStackedBackground();
           } else if (midnightMode) {
                background(8, 12, 24);
                imageMode(CENTER);
                image(moonImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
           } else {
               background(135, 206, 235);
           }

           if (gameState === 'loading') {
               drawLoadingScreen();
               pop();
               return;
           }
           if (gameState !== 'start') {
               if (stackedMode) {
                   drawStackedScenery();
               } else if (!midnightMode) {
                   drawScenery();
               } else {
                   drawNightScenery();
               }
           }

           if (gameState !== 'start' && !stackedMode) {
                for (let cloud of clouds) {
                    cloud.show();
                    if (gameState === 'play') { for (let s = 0; s < simSteps; s++) cloud.update(); }
                }
           }

           if (gameState === 'start' || gameState === 'play' || gameState === 'over') {
                for (let c of confetti) { c.show(); c.update(); }
           }


           if (gameState === 'start') {
               bird.hover();
               bird.show();
               drawStartScreen();
           } else if (gameState === 'ready') {
               drawReadyScreen();
           } else if (gameState === 'play') {
               if (midnightMode && !stackedMode) {
                   // Lightning is deliberately infrequent: a full-screen flash
                   // firing about once a second is unpleasant and a
                   // photosensitivity risk, so it stays an occasional beat.
                   if (random() < 0.005 && flashTimer <= 0) flashTimer = 3;
                   if (flashTimer > 0) {
                       push();
                       fill(200, 208, 255, 120);
                       noStroke();
                       rectMode(CORNER);
                       rect(0, 0, width, height);
                       pop();
                       flashTimer--;
                   }
                   for (let i = 0; i < 6; i++) { rain.push(new Rain(random(width * 1.1), random(-100, 0))); }
                   for (let i = rain.length - 1; i >= 0; i--) { rain[i].fall(); rain[i].show(); if (rain[i].offscreen()) rain.splice(i, 1); }
               }
               if (shieldFlashTimer > 0) {
                   push();
                   fill(255, 215, 60, 120);
                   noStroke();
                   rectMode(CORNER);
                   rect(0, 0, width, height);
                   pop();
                   shieldFlashTimer--;
               }
               for (let p of pipes) { p.show(); }
               for (let hz of hazards) { hz.show(); }
               if (powerUp) powerUp.show();
               bird.show();
               playGame();
               if (gameState === 'play') bird.update();
               if (stackedMode || starMode) {
                   neonTrail.push(new NeonSparkle(bird.x - bird.size * 0.35, bird.y));
               }
               for (let i = neonTrail.length - 1; i >= 0; i--) {
                   neonTrail[i].update();
                   neonTrail[i].show();
                   if (neonTrail[i].offscreen()) neonTrail.splice(i, 1);
               }
               for (let i = shieldParticles.length - 1; i >= 0; i--) {
                   shieldParticles[i].update();
                   shieldParticles[i].show();
                   if (shieldParticles[i].offscreen()) shieldParticles.splice(i, 1);
               }
               for (let i = scorePopups.length - 1; i >= 0; i--) {
                   scorePopups[i].update();
                   scorePopups[i].show();
                   if (scorePopups[i].offscreen()) scorePopups.splice(i, 1);
               }
               drawInGameScore();
               if (gameState === 'play') drawPauseButton();
           } else if (gameState === 'paused') {
               drawPausedScreen();
           } else if (gameState === 'over' || gameState === 'entering_name') {
               if (midnightMode && !stackedMode) { for (let i = rain.length - 1; i >= 0; i--) { rain[i].show(); } }
               for (let p of pipes) { p.show(); }
               for (let hz of hazards) { hz.show(); }
               bird.show();
               for (let i = impactParticles.length - 1; i >= 0; i--) {
                   impactParticles[i].update();
                   impactParticles[i].show();
                   if (impactParticles[i].offscreen()) impactParticles.splice(i, 1);
               }
               if (gameState === 'over') {
                   drawGameOverScreen();
               }
           } else if (gameState === 'leaderboard') {
               drawLeaderboardScreen();
           }
           pop();

           if (gameState === 'start' || gameState === 'over' || gameState === 'leaderboard') {
               drawSoundButton();
           }
           drawToast();
       }

       // Shrink text to fit a width. "Press Start 2P" glyphs are as wide as
       // the font size, so titles sized off screen height ran off the edges
       // of narrow phones ("Game Over", "Score: 1234", leaderboard headings).
       function fitTextSize(str, size, maxW) {
           textSize(size);
           let w = textWidth(str);
           let s = w > maxW ? size * maxW / w : size;
           textSize(s);
           return s;
       }

       function drawInGameScore() {
           push();
           fill(255);
           stroke(0);
           strokeWeight(4);
           textFont(PIXEL_FONT);
           fitTextSize(String(score), height * 0.05, width * 0.5);
           textAlign(CENTER, TOP);
           text(score, width / 2, 20);
           pop();
       }

       function drawReadyScreen() {
           for (let p of pipes) { p.show(); }
           bird.x = width / 4;
           bird.y = height / 2 + sin(frameCount * 0.08) * 8;
           bird.velocity = 0;
           bird.show();
           drawInGameScore();

           // Hold until the first tap, so the run never starts with the duck
           // already falling while someone is still getting a grip on the phone.
           let pulse = 170 + sin(frameCount * 0.12) * 85;
           push();
           textAlign(CENTER, CENTER);
           textFont(PIXEL_FONT);
           stroke(0);
           strokeWeight(4);
           fill(255, 255, 255, pulse);
           fitTextSize('TAP TO FLAP', height * 0.04, width * 0.84);
           text('TAP TO FLAP', width / 2, height * 0.66);
           noStroke();
           fill(255, 230);
           textFont('Inter');
           textSize(max(12, height * 0.018));
           let modeName = stackedMode ? 'STACKED: double points, watch for lasers'
               : (midnightMode ? 'Midnight Flight' : 'Day Flight');
           fitTextSize(modeName, max(12, height * 0.018), width * 0.9);
           text(modeName, width / 2, height * 0.72);
           // little "up" chevrons above the duck
           let bob = sin(frameCount * 0.12) * 4;
           fill(255, 255, 255, pulse);
           let cx = bird.x, cy = bird.y - bird.size * 0.95 + bob, s = bird.size * 0.16;
           triangle(cx - s, cy + s * 0.6, cx + s, cy + s * 0.6, cx, cy - s * 0.6);
           triangle(cx - s, cy + s * 1.8, cx + s, cy + s * 1.8, cx, cy + s * 0.6);
           pop();
       }

       function drawPausedScreen() {
           if (midnightMode && !stackedMode) { for (let i = rain.length - 1; i >= 0; i--) { rain[i].show(); } }
           for (let p of pipes) { p.show(); }
           for (let hz of hazards) { hz.show(); }
           if (powerUp) powerUp.show();
           bird.show();
           drawInGameScore();

           push();
           noStroke();
           fill(0, 0, 0, 140);
           rectMode(CORNER);
           rect(0, 0, width, height);
           textAlign(CENTER, CENTER);
           textFont(PIXEL_FONT);
           fill(255);
           fitTextSize('PAUSED', height * 0.06, width * 0.8);
           text('PAUSED', width / 2, height * 0.42);
           textFont('Inter');
           fill(255, 220 + sin(frameCount * 0.1) * 35);
           textSize(max(14, height * 0.024));
           text('Tap to keep flying', width / 2, height * 0.5);
           pop();
       }

       function pauseButtonRect() {
           return { x: width - CORNER_BTN / 2 - 10, y: CORNER_BTN / 2 + 10, w: CORNER_BTN + 8, h: CORNER_BTN + 8 };
       }

       function drawPauseButton() {
           let r = pauseButtonRect();
           push();
           rectMode(CENTER);
           noStroke();
           fill(0, 0, 0, 70);
           rect(r.x, r.y, CORNER_BTN, CORNER_BTN, 10);
           fill(255, 235);
           let bw = CORNER_BTN * 0.14, bh = CORNER_BTN * 0.46;
           rect(r.x - bw * 1.1, r.y, bw, bh, 2);
           rect(r.x + bw * 1.1, r.y, bw, bh, 2);
           pop();
       }

       function soundButtonRect() {
           return { x: CORNER_BTN / 2 + 10, y: CORNER_BTN / 2 + 10, w: CORNER_BTN + 8, h: CORNER_BTN + 8 };
       }

       function drawSoundButton() {
           let r = soundButtonRect();
           let m = Sfx.isMuted();
           push();
           rectMode(CENTER);
           noStroke();
           fill(0, 0, 0, 80);
           rect(r.x, r.y, CORNER_BTN, CORNER_BTN, 10);
           translate(r.x - CORNER_BTN * 0.08, r.y);
           let u = CORNER_BTN / 40;
           fill(255);
           rectMode(CORNER);
           rect(-10 * u, -4 * u, 6 * u, 8 * u);
           triangle(-4 * u, -4 * u, -4 * u, 4 * u, 4 * u, -10 * u);
           triangle(-4 * u, 4 * u, 4 * u, 10 * u, 4 * u, -10 * u);
           noFill();
           stroke(255);
           strokeWeight(2 * u);
           if (m) {
               line(8 * u, -5 * u, 16 * u, 5 * u);
               line(16 * u, -5 * u, 8 * u, 5 * u);
           } else {
               arc(5 * u, 0, 10 * u, 12 * u, -PI / 3, PI / 3);
               arc(5 * u, 0, 20 * u, 22 * u, -PI / 3, PI / 3);
           }
           pop();
       }

       function drawToast() {
           if (toastTimer <= 0) return;
           toastTimer--;
           let a = min(255, toastTimer * 8);
           push();
           textFont('Inter');
           textSize(max(14, height * 0.02));
           let w = textWidth(toastText) + 36;
           let h = max(14, height * 0.02) + 22;
           rectMode(CENTER);
           noStroke();
           fill(20, 24, 40, a * 0.9);
           rect(width / 2, height * 0.12, w, h, h / 2);
           fill(255, a);
           textAlign(CENTER, CENTER);
           text(toastText, width / 2, height * 0.12);
           pop();
       }

       function drawLoadingScreen() {
           background(30, 30, 30);
           textAlign(CENTER, CENTER);
           textFont(PIXEL_FONT);
           fitTextSize('Loading...', height * 0.05, width * 0.8);
           fill(255);
           text('Loading...', width / 2, height / 2);
       }

       function drawScenery() {
           fill(34, 139, 34);
           noStroke();
           rect(0, height - 50, width, 50);
           imageMode(CENTER);
           image(sunImg, width * 0.9, height * 0.15, width * 0.1, width * 0.1);
       }

       function drawNightScenery() {
           fill(10, 12, 20);
           noStroke();
           rect(0, height - 50, width, 50);
       }

       // --- STACKED mode visuals ---
       // Ping-pong the hue across a synthwave band (cyan -> blue -> purple ->
       // magenta). A full 0-360 cycle would swing through olive/brown, which
       // turns muddy at these low brightnesses.
       function stackedHueAt(phase) {
           let t = (((phase % 360) + 360) % 360) / 360;
           let tri = t < 0.5 ? t * 2 : (1 - t) * 2;
           return 185 + tri * 150;
       }

       function stackedColor(offset, sat = 90, bri = 100, alpha = 255) {
           push();
           colorMode(HSB, 360, 100, 100, 255);
           let c = color(stackedHueAt(stackedHue + offset), sat, bri, alpha);
           pop();
           return c;
       }

       function drawStackedBackground() {
           if (gameState === 'play') stackedHue = (stackedHue + 1.1) % 360;

           push();
           colorMode(HSB, 360, 100, 100, 255);
           noStroke();
           // vertical gradient between two cycling hues
           let bands = 24;
           let bandH = height / bands;
           for (let i = 0; i < bands; i++) {
               let t = i / (bands - 1);
               // deep + saturated so the neon foreground stays readable
               fill(stackedHueAt(stackedHue + t * 70), 92, lerp(16, 40, t));
               rect(0, i * bandH - 1, width, bandH + 2);
           }
           pop();

           // beat pulse
           let beat = (frameCount % 40) / 40;
           if (beat < 0.18 && gameState === 'play') {
               push();
               noStroke();
               fill(255, 255, 255, map(beat, 0, 0.18, 45, 0));
               rect(0, 0, width, height);
               pop();
           }
       }

       function drawStackedScenery() {
           for (let s of stackedShapes) {
               if (gameState === 'play') s.update();
               s.show();
           }
           // neon floor strip
           push();
           noStroke();
           fill(stackedColor(180, 90, 60));
           rect(0, height - 40, width, 40);
           fill(stackedColor(180, 80, 100, 200));
           rect(0, height - 44, width, 4);
           pop();
       }

       function currentMode() {
           return stackedMode ? 'stacked' : (midnightMode ? 'night' : 'day');
       }

       // Deterministic pseudo-random in [0,1) so menu decor keeps its position
       // between frames without needing stored state.
       function hash01(n) {
           let v = sin(n * 127.1) * 43758.5453;
           return abs(v - floor(v));
       }

       function drawThemeTo(g, theme) {
           const W = g.width, H = g.height;
           g.push();
           g.noStroke();

           if (theme === 'day') {
               g.background(135, 206, 235);
               g.imageMode(CENTER);
               if (sunImg) g.image(sunImg, W * 0.86, H * 0.16, W * 0.085, W * 0.085);
               g.imageMode(CORNER);
               if (dayCloudImgs.length) {
                   let img = dayCloudImgs[0];
                   for (let i = 0; i < 4; i++) {
                       let cw = W * (0.11 + 0.03 * hash01(i + 1));
                       let span = W + cw * 2;
                       let x = W + cw - ((frameCount * 0.3 + i * span / 4) % span);
                       let y = H * (0.06 + 0.07 * i);
                       g.image(img, x, y, cw, cw * (img.height / img.width));
                   }
               }
               g.fill(34, 139, 34);
               g.rect(0, H - 50, W, 50);

           } else if (theme === 'night') {
               g.background(8, 12, 24);
               g.imageMode(CENTER);
               if (moonImg) g.image(moonImg, W * 0.86, H * 0.16, W * 0.085, W * 0.085);
               g.imageMode(CORNER);
               if (nightCloudImgs.length) {
                   for (let i = 0; i < 4; i++) {
                       let img = nightCloudImgs[i % nightCloudImgs.length];
                       let cw = W * (0.12 + 0.04 * hash01(i + 7));
                       let span = W + cw * 2;
                       let x = W + cw - ((frameCount * 0.45 + i * span / 4) % span);
                       let y = H * (0.05 + 0.07 * i);
                       g.image(img, x, y, cw, cw * (img.height / img.width));
                   }
               }
               g.stroke(190, 200, 255, 130);
               g.strokeWeight(2);
               for (let i = 0; i < 70; i++) {
                   let x = (hash01(i + 21) * W + frameCount * 6) % W;
                   let y = (hash01(i + 55) * H + frameCount * 15) % H;
                   g.line(x, y, x + 4, y + 16);
               }
               g.noStroke();
               g.fill(10, 12, 20);
               g.rect(0, H - 50, W, 50);

           } else {
               g.colorMode(HSB, 360, 100, 100, 255);
               let bands = 24, bandH = H / bands;
               for (let i = 0; i < bands; i++) {
                   let t = i / (bands - 1);
                   g.fill(stackedHueAt(frameCount * 1.1 + t * 70), 92, lerp(16, 40, t));
                   g.rect(0, i * bandH - 1, W, bandH + 2);
               }
               g.noFill();
               g.strokeWeight(2);
               for (let i = 0; i < 12; i++) {
                   let size = H * (0.03 + 0.07 * hash01(i + 3));
                   let span = W + size * 2;
                   let x = W + size - ((frameCount * (0.5 + hash01(i + 9) * 1.6) + i * span / 12) % span);
                   let y = H * (0.06 + 0.8 * hash01(i + 31));
                   g.stroke(stackedHueAt(frameCount * 1.1 + hash01(i + 5) * 360), 80, 100, 110);
                   g.push();
                   g.translate(x, y);
                   g.rotate(frameCount * 0.01 + i);
                   let kind = floor(hash01(i + 13) * 3);
                   if (kind === 0) g.ellipse(0, 0, size);
                   else if (kind === 1) g.triangle(0, -size / 2, size / 2, size / 2, -size / 2, size / 2);
                   else { g.rectMode(CENTER); g.rect(0, 0, size, size, 4); }
                   g.pop();
               }
               g.noStroke();
               g.fill(stackedHueAt(frameCount * 1.1 + 180), 90, 60);
               g.rect(0, H - 40, W, 40);
               g.fill(stackedHueAt(frameCount * 1.1 + 180), 80, 100, 200);
               g.rect(0, H - 44, W, 4);
               g.colorMode(RGB, 255);
           }
           g.pop();
       }

       function drawMenuBackground() {
           if (!menuBufA || !menuBufB || width <= 0 || height <= 0) {
               background(135, 206, 235);
               return;
           }
           // Re-sync the buffers if they ever drift from the canvas. A page
           // that loads with a zero-size viewport (hidden tab, mid-rotation)
           // would otherwise create 0x0 buffers and throw on every drawImage,
           // with no way to recover once the window got its real size.
           if (menuBufA.width !== width || menuBufA.height !== height) {
               menuBufA.resizeCanvas(width, height);
               menuBufB.resizeCanvas(width, height);
           }
           let idx = floor(frameCount / MENU_HOLD) % MENU_THEMES.length;
           let within = frameCount % MENU_HOLD;
           let fade = within > MENU_HOLD - MENU_FADE
               ? (within - (MENU_HOLD - MENU_FADE)) / MENU_FADE
               : 0;

           drawThemeTo(menuBufA, MENU_THEMES[idx]);
           imageMode(CORNER);
           image(menuBufA, 0, 0, width, height);

           if (fade > 0) {
               drawThemeTo(menuBufB, MENU_THEMES[(idx + 1) % MENU_THEMES.length]);
               // Composite with the context's own alpha rather than p5's
               // tint(): tint copies the image and runs getImageData over it,
               // which on a full-screen buffer is a multi-megabyte pixel
               // readback every frame of the fade.
               push();
               drawingContext.globalAlpha = fade;
               image(menuBufB, 0, 0, width, height);
               drawingContext.globalAlpha = 1;
               pop();
           }
       }

       // Difficulty ramps with score instead of being fixed, so every mode
       // opens forgiving and tightens as a run goes on. `ramp` is the score at
       // which a mode reaches its hardest settings.
       function modeDifficulty() {
           let cfg;
           if (stackedMode) {
               cfg = { ramp: 900, gap: [0.40, 0.26], spd: [0.0058, 0.0105], iv: [84, 40] };
           } else if (midnightMode) {
               cfg = { ramp: 700, gap: [0.36, 0.25], spd: [0.0055, 0.0095], iv: [85, 45] };
           } else {
               cfg = { ramp: 900, gap: [0.42, 0.30], spd: [0.0042, 0.0072], iv: [105, 62] };
           }
           let t = constrain(score / cfg.ramp, 0, 1);
           return {
               spacing: lerp(cfg.gap[0], cfg.gap[1], t) * height,
               speed: lerp(cfg.spd[0], cfg.spd[1], t) * width,
               interval: round(lerp(cfg.iv[0], cfg.iv[1], t)),
               t
           };
       }

       // Menu button metrics. There are 4 buttons (Start/Midnight/Leaderboard/
       // STACKED), so they shrink and the stack is anchored to the bottom to
       // stay on screen.
       function startMenuLayout() {
           let btnWidth = min(width * 0.7, 400);
           let btnHeight = max(42, height * 0.068);
           let step = btnHeight + 14;
           return { btnWidth, btnHeight, step, count: 4, base: height * 0.94 - btnHeight / 2 - step * 3 };
       }

       // Game over also has 4 buttons now (Fly Again / Share / mode switch /
       // Leaderboard), laid out the same way as the menu.
       function overLayout() {
           let btnWidth = min(width * 0.7, 400);
           let btnHeight = max(42, height * 0.066);
           let step = btnHeight + 12;
           return { btnWidth, btnHeight, step, count: 4, base: height * 0.93 - btnHeight / 2 - step * 3 };
       }

       function drawStartScreen() {
           let L = startMenuLayout();
           if (titleImg) {
               imageMode(CENTER);
               let imgWidth = min(width * 0.8, 500);
               let imgHeight = imgWidth * (titleImg.height / titleImg.width);
               // keep the logo clear of the button stack on short screens
               let topRoom = L.base - L.btnHeight / 2 - height * 0.07;
               if (imgHeight > topRoom * 1.1) {
                   imgHeight = topRoom * 1.1;
                   imgWidth = imgHeight * (titleImg.width / titleImg.height);
               }
               image(titleImg, width / 2, min(height / 4, topRoom * 0.5), imgWidth, imgHeight);
           }

           noStroke();
           fill(255);
           textFont('Inter');
           textAlign(CENTER, CENTER);
           let bestLine = `Day Best: ${bestDayScore}    Night Best: ${bestNightScore}    Stacked Best: ${bestStackedScore}`;
           fitTextSize(bestLine, max(11, height * 0.017), width * 0.94);
           text(bestLine, width / 2, L.base - L.btnHeight / 2 - height * 0.035);

           let btnWidth = L.btnWidth;
           let btnHeight = L.btnHeight;
           let base = L.base;
           let step = L.step;
           let sBy1 = base, sBy2 = base + step, sBy3 = base + step * 2;
           drawButton("Start Flying", width / 2, sBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy1, btnWidth, btnHeight));
           drawButton("Midnight Flight", width / 2, sBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy2, btnWidth, btnHeight));
           drawButton("Leaderboard", width / 2, sBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy3, btnWidth, btnHeight));

           let sBy4 = base + step * 3;
           drawStackedButton("⚡ STACKED ⚡", width / 2, sBy4, btnWidth, btnHeight, isMouseOverRect(width / 2, sBy4, btnWidth, btnHeight));

           drawDuxLink();

           noStroke();
           fill(255);
           textSize(12);
           textAlign(RIGHT, BOTTOM);
           textFont('Inter');
           text(`v${DEPLOY_VERSION}`, width - 10, height - 10);
       }

       function drawGameOverScreen() {
           if (overInputLock > 0) overInputLock--;
           gameOverAlpha = min(gameOverAlpha + 12, 150);
           fill(0, 0, 0, gameOverAlpha);
           rect(0, 0, width, height);
           textFont(PIXEL_FONT);
           textAlign(CENTER, CENTER);
           if (stackedMode) {
               fill(stackedColor(0, 90, 100));
               stroke(0);
               strokeWeight(3);
               fitTextSize('STACKED OVER', height * 0.07, width * 0.9);
               text('STACKED OVER', width/2, height * 0.2);
           } else {
               fill(180, 0, 0);
               stroke(0);
               strokeWeight(2);
               fitTextSize('Game Over', height * 0.07, width * 0.9);
               text('Game Over', width/2, height * 0.2);
           }
           noStroke();

           if (lastScoreWasHighScore || lastRunWasPersonalBest) {
               let pulse = 200 + sin(frameCount * 0.15) * 55;
               fill(255, pulse, 0);
               let msg = lastScoreWasHighScore ? 'NEW HIGH SCORE!' : 'NEW PERSONAL BEST!';
               fitTextSize(msg, height * 0.026, width * 0.9);
               text(msg, width / 2, height * 0.27);
           }

           fill(255);
           displayScore += (score - displayScore) * 0.15;
           if (abs(score - displayScore) < 0.5) displayScore = score;
           let scoreLine = `Score: ${floor(displayScore)}`;
           fitTextSize(`Score: ${score}`, height * 0.045, width * 0.9);
           text(scoreLine, width/2, height * 0.34);

           fill(255, 230);
           let modeBest = stackedMode ? bestStackedScore : (midnightMode ? bestNightScore : bestDayScore);
           fitTextSize(`Best: ${modeBest}`, height * 0.024, width * 0.9);
           text(`Best: ${modeBest}`, width/2, height * 0.40);

           let medal = medalFor(score, currentMode());
           if (medal) drawMedal(medal, width / 2, height * 0.465, height * 0.028);

           let L = overLayout();
           let btnWidth = L.btnWidth, btnHeight = L.btnHeight;
           let gBy1 = L.base, gBy2 = L.base + L.step, gBy3 = L.base + L.step * 2, gBy4 = L.base + L.step * 3;
           if (stackedMode) {
               drawStackedButton("STACKED AGAIN", width / 2, gBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy1, btnWidth, btnHeight));
           } else {
               drawButton("Fly Again", width / 2, gBy1, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy1, btnWidth, btnHeight));
           }
           drawButton("Share Score", width / 2, gBy2, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy2, btnWidth, btnHeight), [34, 170, 90], [52, 199, 110]);
           if (stackedMode) {
               drawButton("Exit Stacked", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));
           } else if (midnightMode) {
               drawButton("Day Flight", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));
           } else {
               drawButton("Midnight Flight", width / 2, gBy3, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy3, btnWidth, btnHeight));
           }
           drawButton("Leaderboard", width / 2, gBy4, btnWidth, btnHeight, isMouseOverRect(width / 2, gBy4, btnWidth, btnHeight));

           drawDuxLink();
       }

       async function shareScore() {
           const modeName = stackedMode ? 'STACKED' : (midnightMode ? 'Midnight Flight' : 'Day Flight');
           const text = `I just scored ${score} on Dux-Soup High Fly (${modeName}). Think you can beat it?`;
           try {
               if (navigator.share) {
                   await navigator.share({ title: 'Dux-Soup High Fly', text, url: SHARE_URL });
                   return;
               }
           } catch (e) {
               // Closing the share sheet isn't an error worth reporting.
               if (e && e.name === 'AbortError') return;
           }
           try {
               await navigator.clipboard.writeText(`${text} ${SHARE_URL}`);
               showToast('Copied! Paste it anywhere');
           } catch (e) {
               showToast(SHARE_URL);
           }
       }

       // Medals give a run something to aim at between "died early" and
       // "made the leaderboard". STACKED thresholds are higher because it pays
       // double per pipe.
       function medalFor(s, mode) {
           const tiers = mode === 'stacked'
               ? [[2500, 'PLATINUM', [226, 232, 240], [148, 163, 184]],
                  [1200, 'GOLD',     [255, 215, 60],  [186, 148, 20]],
                  [600,  'SILVER',   [226, 226, 232], [150, 150, 165]],
                  [300,  'BRONZE',   [214, 148, 84],  [148, 96, 48]]]
               : [[2000, 'PLATINUM', [226, 232, 240], [148, 163, 184]],
                  [1000, 'GOLD',     [255, 215, 60],  [186, 148, 20]],
                  [500,  'SILVER',   [226, 226, 232], [150, 150, 165]],
                  [250,  'BRONZE',   [214, 148, 84],  [148, 96, 48]]];
           for (const [min, name, c1, c2] of tiers) {
               if (s >= min) return { name, c1, c2 };
           }
           return null;
       }

       function drawMedal(m, x, y, r) {
           push();
           noStroke();
           fill(m.c2[0], m.c2[1], m.c2[2]);
           ellipse(x, y, r * 2.15);
           fill(m.c1[0], m.c1[1], m.c1[2]);
           ellipse(x, y, r * 1.75);
           fill(255, 255, 255, 90);
           drawStar(x, y, r * 0.3, r * 0.68, 5);
           noStroke();
           fill(m.c1[0], m.c1[1], m.c1[2]);
           textFont(PIXEL_FONT);
           textAlign(CENTER, CENTER);
           textSize(max(9, r * 0.42));
           text(m.name, x, y + r * 1.65);
           pop();
       }

       function drawLeaderboardColumn(data, startIdx, count, xName, xScore, yStart, entrySize, lineGap) {
           textSize(entrySize);
           fill(255);
           for (let i = 0; i < count; i++) {
               let idx = startIdx + i;
               if (idx >= data.length) break;
               let y = yStart + i * (entrySize + lineGap);
               textAlign(LEFT, CENTER);
               text(`${idx + 1}. ${data[idx].name}`, xName, y);
               textAlign(RIGHT, CENTER);
               text(data[idx].score, xScore, y);
           }
       }

       const LEADERBOARD_TABS = [
           { id: 'day', label: 'DAY' },
           { id: 'night', label: 'MIDNIGHT' },
           { id: 'stacked', label: 'STACKED' }
       ];

       function leaderboardTabRect(i) {
           let tabW = min(width * 0.29, 190);
           let tabH = max(height * 0.06, 40);
           let gap = tabW * 0.06;
           let totalW = tabW * 3 + gap * 2;
           let x = width / 2 - totalW / 2 + tabW / 2 + i * (tabW + gap);
           return { x, y: max(height * 0.09, CORNER_BTN + 20 + tabH / 2), w: tabW, h: tabH };
       }

       function leaderboardDataFor(id) {
           if (id === 'stacked') return leaderboardStackedData;
           if (id === 'night') return leaderboardNightData;
           return leaderboardDayData;
       }

       function drawLeaderboardScreen() {
           fill(0, 0, 0, 150);
           rect(0, 0, width, height);
           textFont(PIXEL_FONT);
           textAlign(CENTER, CENTER);

           // mode tabs
           for (let i = 0; i < LEADERBOARD_TABS.length; i++) {
               let tab = LEADERBOARD_TABS[i];
               let r = leaderboardTabRect(i);
               let selected = leaderboardTab === tab.id;
               let hovered = isMouseOverRect(r.x, r.y, r.w, r.h);
               push();
               rectMode(CENTER);
               strokeWeight(selected ? 3 : 2);
               if (tab.id === 'stacked') {
                   stroke(selected ? color(255, 255, 255) : color(255, 120, 220));
                   fill(selected ? color(150, 40, 170) : (hovered ? color(90, 30, 110) : color(45, 20, 60)));
               } else {
                   stroke(selected ? color(255, 255, 255) : color(150, 170, 220));
                   fill(selected ? color(60, 100, 255) : (hovered ? color(45, 60, 130) : color(25, 30, 60)));
               }
               rect(r.x, r.y, r.w, r.h, 8);
               noStroke();
               fill(selected ? 255 : 200);
               textFont(PIXEL_FONT);
               fitTextSize(tab.label, min(r.h * 0.3, r.w * 0.13), r.w * 0.86);
               textAlign(CENTER, CENTER);
               text(tab.label, r.x, r.y);
               pop();
           }

           let data = leaderboardDataFor(leaderboardTab);
           let tabBottom = leaderboardTabRect(0).y + leaderboardTabRect(0).h / 2;
           let headingY = max(height * 0.2, tabBottom + height * 0.05);

           push();
           textFont(PIXEL_FONT);
           textAlign(CENTER, CENTER);
           fill(leaderboardTab === 'stacked' ? color(255, 120, 220) : color(255, 215, 0));
           let heading = leaderboardTab === 'stacked' ? '--- STACKED ---'
               : (leaderboardTab === 'night' ? '--- MIDNIGHT FLIGHT ---' : '--- DAY FLIGHT ---');
           fitTextSize(heading, height * 0.022, width * 0.9);
           text(heading, width / 2, headingY);
           pop();

           let listTop = headingY + height * 0.07;
           if (data.length === 0) {
               push();
               textFont(PIXEL_FONT);
               textAlign(CENTER, CENTER);
               fitTextSize('No scores yet', height * 0.018, width * 0.8);
               fill(220);
               text('No scores yet', width / 2, height * 0.35);
               pop();
           } else if (width < 640) {
               // One full-width column: two narrow columns let 10-character
               // names collide with their scores on a phone.
               let entrySize = min(height * 0.015, width * 0.034);
               let lineGap = height * 0.0085;
               drawLeaderboardColumn(data, 0, 20, width * 0.08, width * 0.92, listTop, entrySize, lineGap);
           } else {
               let entrySize = height * 0.02;
               let lineGap = height * 0.009;
               drawLeaderboardColumn(data, 0, 10, width * 0.08, width * 0.44, listTop, entrySize, lineGap);
               drawLeaderboardColumn(data, 10, 10, width * 0.56, width * 0.92, listTop, entrySize, lineGap);
           }

           let btnWidth = min(width * 0.7, 400);
           let btnHeight = max(42, height * 0.07);
           let backY = height * 0.9;
           drawButton("Back", width / 2, backY, btnWidth, btnHeight, isMouseOverRect(width / 2, backY, btnWidth, btnHeight));

           drawDuxLink();
       }

       function getLinkTextSize() {
           return max(12, height * 0.018);
       }

       function getPortraitLinkY() {
           if (gameState === 'start') {
               let L = startMenuLayout();
               return L.base + L.step * (L.count - 1) + L.btnHeight / 2 + 22;
           }
           if (gameState === 'over') {
               let L = overLayout();
               return L.base + L.step * (L.count - 1) + L.btnHeight / 2 + 22;
           }
           let btnHeight = max(42, height * 0.07);
           return height * 0.9 + btnHeight / 2 + 24;
       }

       // --- UPDATED: Responsive link positioning ---
       function drawDuxLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           const isHovering = isMouseOverLink();
           const linkColor = isHovering ? color(255, 255, 255) : color(200, 220, 255);

           fill(linkColor);
           noStroke();
           textFont('Inter');
           textSize(size);

           let x, y, linkW;
           const isPortrait = width < height;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                y = getPortraitLinkY();
                x = width / 2;
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW / 2, y + size / 2 + 2, x + linkW / 2, y + size / 2 + 2);
                }
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40;
                text(linkText, x, y);
                linkW = textWidth(linkText);
                if (isHovering) {
                    stroke(linkColor);
                    strokeWeight(1);
                    line(x - linkW, y + 2, x, y + 2);
                }
           }
       }

       function isMouseOverLink() {
           const linkText = "What is Dux-Soup";
           const size = getLinkTextSize();
           textFont('Inter');
           textSize(size);

           const isPortrait = width < height;
           let x, y, linkW, linkH;

           if (isPortrait) {
                textAlign(CENTER, CENTER);
                y = getPortraitLinkY();
                x = width / 2;
                linkW = textWidth(linkText);
                linkH = size * 2;
                return (mouseX > x - linkW / 2 && mouseX < x + linkW / 2 &&
                        mouseY > y - linkH / 2 && mouseY < y + linkH / 2);
           } else {
                textAlign(RIGHT, BOTTOM);
                x = width - 20;
                y = height - 40;
                linkW = textWidth(linkText);
                linkH = size * 1.5;
                return (mouseX > x - linkW && mouseX < x &&
                        mouseY > y - linkH && mouseY < y);
           }
       }

       function isMouseOverRect(x, y, w, h) {
           return mouseX > x - w / 2 && mouseX < x + w / 2 && mouseY > y - h / 2 && mouseY < y + h / 2;
       }

       function drawStackedButton(txt, x, y, w, h, hovered = false) {
           let by = y + (hovered ? -2 : 0);
           let cycle = (frameCount * 2) % 360;
           push();
           colorMode(HSB, 360, 100, 100, 255);
           rectMode(CENTER);
           // outer glow
           noStroke();
           fill(cycle, 90, 100, 60);
           rect(x, by, w + 14, h + 14, 14);
           // body gradient-ish bands
           let bands = 10;
           for (let i = 0; i < bands; i++) {
               let t = i / (bands - 1);
               fill((cycle + t * 120) % 360, 85, hovered ? 100 : 92);
               rect(x, by - h / 2 + h * ((i + 0.5) / bands), w, h / bands + 1, 0);
           }
           noFill();
           stroke(0, 0, 100);
           strokeWeight(3);
           rect(x, by, w, h, 10);
           pop();

           push();
           noStroke();
           fill(255);
           stroke(0, 0, 0, 120);
           strokeWeight(3);
           textFont(PIXEL_FONT);
           fitTextSize(txt, h * 0.28, w * 0.88);
           textAlign(CENTER, CENTER);
           text(txt, x, by);
           pop();
           rectMode(CORNER);
       }

       function drawButton(txt, x, y, w, h, hovered = false, base = [60, 100, 255], hover = [100, 140, 255]) {
           let by = y + (hovered ? -2 : 0);
           stroke(255);
           strokeWeight(3);
           fill(hovered ? color(hover[0], hover[1], hover[2]) : color(base[0], base[1], base[2]));
           rectMode(CENTER);
           rect(x, by, w, h, 10);
           fill(255);
           noStroke();
           textFont('Inter');
           fitTextSize(txt, h * 0.4, w * 0.88);
           textAlign(CENTER, CENTER);
           text(txt, x, by);
           rectMode(CORNER);
       }

       function playGame() {
           simFrame++;
           if (shieldGraceFrames > 0) shieldGraceFrames--;

           let diff = modeDifficulty();
           // While a laser is telegraphing/firing, hold off on new pipes. That
           // keeps the corridor the player must thread through predictable, and
           // reads as a deliberate breather in the pipe rhythm.
           let holdPipes = stackedMode && hazards.length > 0;
            if (simFrame % diff.interval === 0 && !holdPipes) {
               let lastPipe = pipes.length > 0 ? pipes[pipes.length - 1] : null;
               let newPipe = new Pipe(lastPipe);
               pipes.push(newPipe);
               if (!hasShield && !powerUp && score > 0 && random() < (stackedMode ? 0.26 : 0.18)) {
                   powerUp = new PowerUp(newPipe.x + newPipe.w / 2, newPipe.top + newPipe.spacing / 2);
               }
           }

           if (stackedMode) {
               // One laser at a time, and only once a run is properly underway.
               if (score >= 150 && hazards.length === 0 && random() < lerp(0.005, 0.013, diff.t)) {
                   spawnSafeLaser();
               }
               for (let i = hazards.length - 1; i >= 0; i--) {
                   hazards[i].update();
                   if (hazards[i].hits(bird) && shieldGraceFrames <= 0) {
                       if (hasShield) {
                           hasShield = false;
                           shieldGraceFrames = 30;
                           shieldFlashTimer = 8;
                           Sfx.shieldBreak();
                           buzz(25);
                           for (let k = 0; k < 20; k++) shieldParticles.push(new ShieldParticle(bird.x, bird.y));
                       } else {
                           endGame();
                           return;
                       }
                   }
                   if (hazards[i].done()) hazards.splice(i, 1);
               }
           }
           for (let i = pipes.length - 1; i >= 0; i--) {
               pipes[i].update();
               if (pipes[i].hits(bird) && shieldGraceFrames <= 0) {
                   if (hasShield) {
                       hasShield = false;
                       shieldGraceFrames = 24;
                       shieldFlashTimer = 8;
                       bird.velocity = bird.lift * 0.6;
                       Sfx.shieldBreak();
                       buzz(25);
                       for (let k = 0; k < 20; k++) shieldParticles.push(new ShieldParticle(bird.x, bird.y));
                   } else {
                       endGame();
                       return;
                   }
               }
               if (!pipes[i].passed && pipes[i].x + pipes[i].w < bird.x) {
                   pipes[i].passed = true;
                   let gain = stackedMode ? 10 : 5;
                   score += gain;
                   scorePopups.push(new ScorePopup(bird.x, bird.y - bird.size * 0.7, gain));
                   if (score > 0 && score % 50 === 0) {
                       launchConfetti();
                       Sfx.milestone();
                   } else {
                       Sfx.score();
                   }
               }
               if (pipes[i].offscreen()) {
                   pipes.splice(i, 1);
               }
           }

           if (powerUp) {
               powerUp.update();
               if (powerUp.hits(bird)) {
                   hasShield = true;
                   Sfx.pickup();
                   buzz(15);
                   for (let k = 0; k < 18; k++) shieldParticles.push(new ShieldParticle(powerUp.x, powerUp.y));
                   powerUp = null;
               } else if (powerUp.offscreen()) {
                   powerUp = null;
               }
           }

           if (bird.y > height - bird.size / 2 || bird.y < bird.size / 2) {
               endGame();
           }
       }

       function endGame() {
           if (gameState === 'over' || gameState === 'entering_name') return;

           shakeDuration = 20;
           shakeAmount = 8;
           gameOverAlpha = 0;
           displayScore = 0;
           overInputLock = 28;
           Sfx.hit();
           buzz([40, 30, 60]);
           for (let i = 0; i < 24; i++) {
               impactParticles.push(new ImpactParticle(bird.x, bird.y));
           }

           lastRunWasPersonalBest = false;
           if (stackedMode) {
               if (score > bestStackedScore) {
                   lastRunWasPersonalBest = bestStackedScore > 0;
                   bestStackedScore = score;
                   safeSet('duxHighFlyBestStacked', bestStackedScore);
               }
           } else if (midnightMode) {
               if (score > bestNightScore) {
                   lastRunWasPersonalBest = bestNightScore > 0;
                   bestNightScore = score;
                   safeSet('duxHighFlyBestNight', bestNightScore);
               }
           } else {
               if (score > bestDayScore) {
                   lastRunWasPersonalBest = bestDayScore > 0;
                   bestDayScore = score;
                   safeSet('duxHighFlyBestDay', bestDayScore);
               }
           }

           if (window.checkHighScore && window.checkHighScore(score, currentMode())) {
               lastScoreWasHighScore = true;
               Sfx.best();
               gameState = 'entering_name';
           } else {
               lastScoreWasHighScore = false;
               if (lastRunWasPersonalBest) Sfx.best();
               gameState = 'over';
           }
       }

       function mousePressed() {
           if (gameState === 'entering_name') {
               return;
           }
           Sfx.unlock();

           if (gameState === 'start' || gameState === 'over' || gameState === 'leaderboard') {
               let r = soundButtonRect();
               if (isMouseOverRect(r.x, r.y, r.w, r.h)) {
                   Sfx.toggle();
                   showToast(Sfx.isMuted() ? 'Sound off' : 'Sound on');
                   return false;
               }
               if (isMouseOverLink()) {
                   window.open('https://www.dux-soup.com/', '_blank');
                   return false;
               }
           }

           if (gameState === 'play') {
               let r = pauseButtonRect();
               if (isMouseOverRect(r.x, r.y, r.w, r.h)) {
                   pauseGame();
                   return false;
               }
           }

           if (gameState === 'start') {
               let d = dist(mouseX, mouseY, bird.x, bird.y);
               if (d < bird.size / 2) {
                   duxTapCount++;
                   if (duxTapCount === 5) {
                       starMode = !starMode;
                       if (starMode) launchConfetti(width / 2, height / 2, 200);
                       duxTapCount = 0;
                   }
               }
           }

           handleInput();
           return false;
       }

       function keyPressed() {
           if (gameState === 'entering_name') return;
           Sfx.unlock();

           const flap = (key === ' ' || keyCode === UP_ARROW || key === 'w' || key === 'W');
           const confirm = (key === ' ' || keyCode === ENTER);
           const pauseKey = (key === 'p' || key === 'P' || keyCode === ESCAPE);

           if (gameState === 'play') {
               if (pauseKey) { pauseGame(); return false; }
               if (flap) { bird.up(); return false; }
               return;
           }
           if (gameState === 'ready') {
               if (flap || confirm) { beginFlight(); return false; }
               if (keyCode === ESCAPE) { stackedMode = false; gameState = 'start'; return false; }
               return;
           }
           if (gameState === 'paused') {
               if (flap || confirm || pauseKey) { resumeGame(); return false; }
               return;
           }
           if (key === 'm' || key === 'M') {
               Sfx.toggle();
               showToast(Sfx.isMuted() ? 'Sound off' : 'Sound on');
               return false;
           }
           // Keyboard parity with the mouse: start, retry and back-out without
           // having to reach for the pointer.
           if (gameState === 'start' && confirm) {
               midnightMode = false; stackedMode = false;
               startGame();
               return false;
           }
           if (gameState === 'over' && confirm) {
               if (overInputLock > 0) return false;
               startGame();
               return false;
           }
           if (gameState === 'leaderboard' && (confirm || keyCode === ESCAPE)) {
               gameState = 'start';
               return false;
           }
           if (gameState === 'over' && keyCode === ESCAPE) {
               stackedMode = false;
               gameState = 'start';
               return false;
           }
       }

       function handleInput() {
           if (gameState === 'play') {
               bird.up();
               return;
           }
           if (gameState === 'ready') {
               beginFlight();
               return;
           }
           if (gameState === 'paused') {
               resumeGame();
               return;
           }

           if (gameState === 'entering_name') return;

           let btnWidth, btnHeight;
           if (gameState === 'start') {
               let L = startMenuLayout();
               btnWidth = L.btnWidth;
               btnHeight = L.btnHeight;
               let base = L.base;
               let step = L.step;
               if (isMouseOverRect(width/2, base, btnWidth, btnHeight)) {
                   midnightMode = false;
                   stackedMode = false;
                   startGame();
               }
               if (isMouseOverRect(width/2, base + step, btnWidth, btnHeight)) {
                   midnightMode = true;
                   stackedMode = false;
                   startGame();
               }
               if (isMouseOverRect(width/2, base + step * 2, btnWidth, btnHeight)) {
                   gameState = 'leaderboard';
               }
               if (isMouseOverRect(width/2, base + step * 3, btnWidth, btnHeight)) {
                   midnightMode = false;
                   stackedMode = true;
                   startGame();
               }
           } else if (gameState === 'over') {
               if (overInputLock > 0) return;
               let L = overLayout();
               btnWidth = L.btnWidth;
               btnHeight = L.btnHeight;
               let base = L.base, step = L.step;
               if (isMouseOverRect(width/2, base, btnWidth, btnHeight)) {
                   startGame();
               } else if (isMouseOverRect(width/2, base + step, btnWidth, btnHeight)) {
                   shareScore();
               } else if (isMouseOverRect(width/2, base + step * 2, btnWidth, btnHeight)) {
                   if (stackedMode) {
                       stackedMode = false;
                       gameState = 'start';
                   } else {
                       midnightMode = !midnightMode;
                       startGame();
                   }
               } else if (isMouseOverRect(width/2, base + step * 3, btnWidth, btnHeight)) {
                   leaderboardTab = currentMode();
                   gameState = 'leaderboard';
               }
           } else if (gameState === 'leaderboard') {
               for (let i = 0; i < LEADERBOARD_TABS.length; i++) {
                   let r = leaderboardTabRect(i);
                   if (isMouseOverRect(r.x, r.y, r.w, r.h)) {
                       leaderboardTab = LEADERBOARD_TABS[i].id;
                       return;
                   }
               }
               btnWidth = min(width * 0.7, 400);
               btnHeight = max(42, height * 0.07);
               if (isMouseOverRect(width/2, height*0.9, btnWidth, btnHeight)) {
                   gameState = 'start';
               }
           }
       }

       function startGame() {
           gameState = 'ready';
           pipes = [];
           confetti = [];
           scorePopups = [];
           impactParticles = [];
           neonTrail = [];
           shieldParticles = [];
           hazards = [];
           rain = [];
           powerUp = null;
           hasShield = false;
           shieldGraceFrames = 0;
           shieldFlashTimer = 0;
           gameOverAlpha = 0;
           displayScore = 0;
           lastScoreWasHighScore = false;
           lastRunWasPersonalBest = false;
           score = 0;
           simAcc = 0;
           simFrame = 0;
           bird.reset();
           pipes.push(new Pipe(null));
           clouds = [];
           for (let i = 0; i < 3; i++) {
               clouds.push(new Cloud(random(width * 0.2, width * 1.3), random(height * 0.05, height * 0.25)));
           }
           if (stackedMode) {
               stackedShapes = [];
               for (let i = 0; i < 14; i++) stackedShapes.push(new StackedShape());
           }
       }

       // Recolour a sprite's opaque pixels to a single cycling hue.
       //
       // tint() can't do this: it multiplies, so tinting the blue/yellow duck
       // red yields near-black rather than a red duck. Instead we stamp the
       // sprite into a scratch buffer and use a 'source-in' composite to paint
       // solid colour through its alpha mask, giving a true silhouette recolour.
       function starSilhouette(img) {
           if (!starBuf || !img) return null;
           starBuf.clear();
           starBuf.push();
           starBuf.imageMode(CORNER);
           starBuf.image(img, 0, 0, starBuf.width, starBuf.height);
           starBuf.drawingContext.globalCompositeOperation = 'source-in';
           starBuf.colorMode(HSB, 360, 100, 100, 255);
           starBuf.noStroke();
           starBuf.fill((frameCount * 26) % 360, 92, 100);
           starBuf.rect(0, 0, starBuf.width, starBuf.height);
           starBuf.drawingContext.globalCompositeOperation = 'source-over';
           starBuf.pop();
           return starBuf;
       }

       // Day flies the original duck; Midnight and STACKED fly the magenta one.
       // The menu always shows the default so the 5-tap star toggle reads
       // against a known baseline.
       function birdSpriteForMode() {
           if (gameState === 'start') return birdImg;
           return (stackedMode || midnightMode) ? secretBirdImg : birdImg;
       }

       class Bird {
           constructor() { this.size = height * 0.08; this.reset(); }
           reset() { this.size = height * 0.08; this.x = width / 4; this.y = height / 2; this.gravity = 0.0005 * height; this.lift = -0.012 * height; this.velocity = 0; this.baseY = height / 2; }
           update() { this.velocity += this.gravity; this.velocity *= 0.98; this.y += this.velocity; }
           hover() { this.x = width / 2; this.y = this.baseY + sin(frameCount * 0.05) * 10; this.velocity = 0; }
           show() {
               let imgToShow = birdSpriteForMode();
               push();
               translate(this.x, this.y);
               let angle = map(this.velocity, -10, 15, -PI / 4, PI / 4);
               if (gameState !== 'play' && gameState !== 'paused') angle = 0;
               rotate(angle);
               imageMode(CENTER);
               if (gameState === 'play' || gameState === 'paused') {
                   let squashY = map(constrain(this.velocity, -10, 15), -10, 15, 0.82, 1.15);
                   scale(2 - squashY, squashY);
               }

               if (starMode) {
                   // Mario-style invincibility strobe: flash between the duck's
                   // own colours and a solid rainbow recolour of its shape.
                   let sil = (frameCount % 8 < 5) ? starSilhouette(imgToShow) : null;
                   image(sil || imgToShow, 0, 0, this.size, this.size);
               } else {
                   image(imgToShow, 0, 0, this.size, this.size);
               }
               pop();

               if ((gameState === 'play' || gameState === 'paused') && hasShield) {
                   push();
                   noFill();
                   stroke(255, 215, 60, 180 + sin(frameCount * 0.3) * 60);
                   strokeWeight(3);
                   ellipse(this.x, this.y, this.size * 1.35 + sin(frameCount * 0.2) * 4);
                   pop();
               }
            }
           up() { this.velocity = this.lift; Sfx.flap(); }
       }

       function drawStar(x, y, radius1, radius2, npoints) {
           let angle = TWO_PI / npoints;
           let halfAngle = angle / 2.0;
           beginShape();
           for (let a = 0; a < TWO_PI; a += angle) {
               let sx = x + cos(a) * radius2;
               let sy = y + sin(a) * radius2;
               vertex(sx, sy);
               sx = x + cos(a + halfAngle) * radius1;
               sy = y + sin(a + halfAngle) * radius1;
               vertex(sx, sy);
           }
           endShape(CLOSE);
       }

       class PowerUp {
           constructor(x, y) {
               this.x = x;
               this.y = y;
               this.size = height * 0.05;
               this.speed = modeDifficulty().speed;
               this.angle = 0;
           }
           update() {
               this.x -= this.speed;
               this.angle += 0.06;
           }
           show() {
               push();
               translate(this.x, this.y);
               let pulse = 1 + sin(frameCount * 0.15) * 0.1;
               noStroke();
               fill(255, 215, 60, 50);
               ellipse(0, 0, this.size * 2.2 * pulse);
               rotate(this.angle);
               fill(255, 223, 70);
               drawStar(0, 0, this.size * 0.28, this.size * 0.6, 5);
               pop();
           }
           offscreen() { return this.x < -this.size * 2; }
           hits(bird) {
               let r = this.size * 0.9 + bird.size * 0.35;
               return dist(this.x, this.y, bird.x, bird.y) < r;
           }
       }

       // Telegraphed horizontal laser bar: warns, fires, fades.
       class LaserBar {
           constructor() {
               this.y = random(height * 0.18, height * 0.82);
               this.thickness = height * 0.05;
               this.warn = 55;
               this.active = 45;
               this.fade = 18;
               // warm danger hue, deliberately outside the cool backdrop band
               this.hue = random([348, 356, 8]);
           }
           update() {
               if (this.warn > 0) {
                   this.warn--;
                   if (this.warn === 0) Sfx.laser();
               }
               else if (this.active > 0) this.active--;
               else if (this.fade > 0) this.fade--;
           }
           isFiring() { return this.warn <= 0 && this.active > 0; }
           done() { return this.warn <= 0 && this.active <= 0 && this.fade <= 0; }
           show() {
               push();
               colorMode(HSB, 360, 100, 100, 255);
               noStroke();
               if (this.warn > 0) {
                   // flashing warning strip + edge chevrons
                   let blink = (frameCount % 10 < 5) ? 255 : 120;
                   fill(this.hue, 95, 100, blink * 0.42);
                   rect(0, this.y - this.thickness / 2, width, this.thickness);
                   fill(this.hue, 90, 100, blink);
                   rect(0, this.y - 3, width, 6);
                   // hatched edges so it reads as "charging"
